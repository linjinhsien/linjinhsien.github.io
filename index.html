    :root {
      --azure: #0078d4;
      --azure-dark: #005a9e;
      --azure-light: #d0e8f8;
      --correct: #107c10;
      --correct-bg: #dff6dd;
      --wrong: #c50f1f;
      --wrong-bg: #fde7e9;
      --neutral: #605e5c;
      --bg: #f3f2f1;
      --card: #ffffff;
      --text: #201f1e;
      --border: #d2d0ce;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--azure);
      letter-spacing: -0.3px;
    }

    header p {
      color: var(--neutral);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .progress-wrap {
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--neutral);
      margin-bottom: 6px;
    }

    .progress-bar-track {
      background: var(--border);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--azure);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .question-meta {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--azure);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .question-text .en-sub {
      display: block;
      margin-top: 6px;
      font-size: 0.92rem;
      color: #484644;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: #faf9f8;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--azure);
      background: var(--azure-light);
    }

    .option-btn .letter {
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      margin-top: 1px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .option-btn:hover:not(:disabled) .letter {
      border-color: var(--azure);
      color: var(--azure);
    }

    .option-btn.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
    }

    .option-btn.correct .letter {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    .option-btn.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .option-btn.wrong .letter {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #fff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .explanation {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: #f0f6fc;
      border-left: 4px solid var(--azure);
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text);
      display: none;
    }

    .explanation strong {
      display: block;
      margin-bottom: 4px;
      color: var(--azure-dark);
    }

    .explanation.visible { display: block; }

    .actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 10px 22px;
      border-radius: var(--radius);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--azure);
      color: #fff;
    }

    .btn-primary:hover { background: var(--azure-dark); }

    .btn-secondary {
      background: transparent;
      color: var(--azure);
      border: 2px solid var(--azure);
    }

    .btn-secondary:hover { background: var(--azure-light); }

    /* Results screen */
    .results {
      text-align: center;
      padding: 40px 32px;
    }

    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .score-ring.pass {
      background: var(--correct-bg);
      border: 5px solid var(--correct);
      color: var(--correct);
    }

    .score-ring.fail {
      background: var(--wrong-bg);
      border: 5px solid var(--wrong);
      color: var(--wrong);
    }

    .score-ring .pct {
      font-size: 2rem;
      line-height: 1;
    }

    .score-ring .label {
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .results h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .results .subtitle {
      color: var(--neutral);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-box {
      padding: 12px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      min-width: 100px;
    }

    .stat-box .num {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-box .desc {
      font-size: 0.78rem;
      color: var(--neutral);
      margin-top: 2px;
    }

    .stat-box.green .num { color: var(--correct); }
    .stat-box.red .num { color: var(--wrong); }

    .disclaimer {
      font-size: 0.75rem;
      color: var(--neutral);
      margin-top: 16px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 500px) {
      .card { padding: 20px 16px; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>

let current = 0;
let score = 0;
let skipped = 0;
let answered = new Array(QUESTIONS.length).fill(null);
let shuffled = [];
let isResultsView = false;

function getLang() {
  return (window.AZ900_I18N && window.AZ900_I18N.getLang()) || 'bi';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  shuffled = shuffle(QUESTIONS.map((_, i) => i));
  current = 0;
  score = 0;
  skipped = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  isResultsView = false;
  document.getElementById('progressWrap').style.display = '';
  // Restore quizCard inner structure if coming from results screen
  const card = document.getElementById('quizCard');
  if (!document.getElementById('questionText')) {
    card.innerHTML = `
      <div class="question-meta" id="questionMeta"></div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="explanation" id="explanation"></div>
      <div class="actions">
        <button class="btn btn-secondary" id="skipBtn" onclick="skipQuestion()">略過</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none">下一題 →</button>
      </div>
    `;
  }
  renderQuestion();
}

function renderQuestion() {
  if (isResultsView) {
    showResults();
    return;
  }
  const lang = getLang();
  const total = QUESTIONS.length;
  const qi = shuffled[current];
  const q = QUESTIONS[qi];
  const userAns = answered[current];
  const hasAnswered = userAns !== null && userAns !== -1;

  if (lang === 'en') {
    document.getElementById('progressText').textContent = `Question ${current + 1} of ${total}`;
    document.getElementById('scoreText').textContent = `Score: ${score}`;
    document.getElementById('questionMeta').innerHTML = `Question ${current + 1} &bull; ${q.topic}`;
    document.getElementById('questionText').textContent = q.q;
    document.getElementById('skipBtn').textContent = 'Skip';
    document.getElementById('nextBtn').textContent = 'Next →';
  } else if (lang === 'bi') {
    document.getElementById('progressText').textContent = `題目 ${current + 1} / ${total} (Question ${current + 1} of ${total})`;
    document.getElementById('scoreText').textContent = `得分 (Score)：${score}`;
    document.getElementById('questionMeta').innerHTML = `題目 ${current + 1} &bull; ${q.topicZh} (${q.topic})`;
    document.getElementById('questionText').innerHTML = `${q.qZh}<span class="en-sub">${q.q}</span>`;
    document.getElementById('skipBtn').textContent = '略過 (Skip)';
    document.getElementById('nextBtn').textContent = '下一題 (Next) →';
  } else {
    document.getElementById('progressText').textContent = `題目 ${current + 1} / ${total}`;
    document.getElementById('scoreText').textContent = `得分：${score}`;
    document.getElementById('questionMeta').innerHTML = `題目 ${current + 1} &bull; ${q.topicZh}`;
    document.getElementById('questionText').textContent = q.qZh;
    document.getElementById('skipBtn').textContent = '略過';
    document.getElementById('nextBtn').textContent = '下一題 →';
  }

  document.getElementById('progressFill').style.width = `${(current / total) * 100}%`;

  const letters = ['A', 'B', 'C', 'D'];
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach((optEn, i) => {
    const optZh = q.optsZh ? q.optsZh[i] : optEn;
    let labelHtml = optZh;
    if (lang === 'en') {
      labelHtml = optEn;
    } else if (lang === 'bi') {
      labelHtml = optZh === optEn ? optZh : `${optZh}<span class="bi-sub">${optEn}</span>`;
    }
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (hasAnswered) {
      btn.disabled = true;
      if (i === userAns) btn.classList.add(userAns === q.a ? 'correct' : 'wrong');
      if (userAns !== q.a && i === q.a) btn.classList.add('correct');
    }
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${labelHtml}</span>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  const exp = document.getElementById('explanation');
  if (hasAnswered) {
    const isCorrect = userAns === q.a;
    renderExplanationText(exp, q, isCorrect, lang);
    exp.className = 'explanation visible';
    document.getElementById('nextBtn').style.display = '';
    document.getElementById('skipBtn').style.display = 'none';
  } else {
    exp.className = 'explanation';
    exp.innerHTML = '';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('skipBtn').style.display = '';
  }
}

function renderExplanationText(expEl, q, isCorrect, lang) {
  if (lang === 'en') {
    expEl.innerHTML = `<strong>${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</strong>${q.exp}`;
  } else if (lang === 'bi') {
    expEl.innerHTML = `<strong>${isCorrect ? '✓ 答對了！ (Correct!)' : '✗ 答錯了 (Incorrect)'}</strong>${q.expZh}<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #c7e0f4;color:#484644;font-size:0.85rem;">${q.exp}</div>`;
  } else {
    expEl.innerHTML = `<strong>${isCorrect ? '✓ 答對了！' : '✗ 答錯了'}</strong>${q.expZh}`;
  }
}

function selectAnswer(idx) {
  const qi = shuffled[current];
  const q = QUESTIONS[qi];
  const buttons = document.querySelectorAll('.option-btn');

  buttons.forEach(btn => btn.disabled = true);

  const isCorrect = idx === q.a;
  if (isCorrect) score++;
  answered[current] = idx;

  buttons[idx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) buttons[q.a].classList.add('correct');

  const lang = getLang();
  const exp = document.getElementById('explanation');
  renderExplanationText(exp, q, isCorrect, lang);
  exp.className = 'explanation visible';

  document.getElementById('nextBtn').style.display = '';
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('scoreText').textContent = lang === 'en' ? `Score: ${score}` : (lang === 'bi' ? `得分 (Score)：${score}` : `得分：${score}`);
}

function skipQuestion() {
  skipped++;
  answered[current] = -1;
  nextQuestion();
}

function nextQuestion() {
  current++;
  if (current >= QUESTIONS.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  isResultsView = true;
  const lang = getLang();
  const total = QUESTIONS.length;
  const pct = Math.round((score / total) * 100);
  const pass = pct >= 70;

  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = lang === 'en' ? 'Complete' : (lang === 'bi' ? '測驗完成 (Complete)' : '測驗完成');
  document.getElementById('scoreText').textContent = lang === 'en' ? `Score: ${score}` : (lang === 'bi' ? `得分 (Score)：${score}` : `得分：${score}`);

  const card = document.getElementById('quizCard');
  if (lang === 'en') {
    card.innerHTML = `
      <div class="results">
        <div class="score-ring ${pass ? 'pass' : 'fail'}">
          <span class="pct">${pct}%</span>
          <span class="label">${pass ? 'PASS' : 'FAIL'}</span>
        </div>
        <h2>${pass ? 'Well done!' : 'Keep studying!'}</h2>
        <p class="subtitle">${pass ? 'You have a strong grasp of Azure Fundamentals.' : 'Review the Azure Fundamentals 30-day study guide and try again.'}</p>
        <div class="stats">
          <div class="stat-box green"><div class="num">${score}</div><div class="desc">Correct</div></div>
          <div class="stat-box red"><div class="num">${total - score - skipped}</div><div class="desc">Incorrect</div></div>
          <div class="stat-box"><div class="num">${skipped}</div><div class="desc">Skipped</div></div>
          <div class="stat-box"><div class="num">${total}</div><div class="desc">Total</div></div>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">Try Again</button>
        <p class="disclaimer">AZ-900 passing score is ~700/1000 (≈70%). Questions are randomized each attempt.</p>
      </div>
    `;
  } else {
    card.innerHTML = `
      <div class="results">
        <div class="score-ring ${pass ? 'pass' : 'fail'}">
          <span class="pct">${pct}%</span>
          <span class="label">${pass ? '通過 PASS' : '未通過 FAIL'}</span>
        </div>
        <h2>${pass ? '表現優異！ (Well done!)' : '繼續加油！ (Keep studying!)'}</h2>
        <p class="subtitle">${pass ? '您已紮實掌握 Azure Fundamentals 核心觀念。' : '建議搭配「30 天全詳解」複習弱點章節後再挑戰一次。'}</p>
        <div class="stats">
          <div class="stat-box green"><div class="num">${score}</div><div class="desc">答對 (Correct)</div></div>
          <div class="stat-box red"><div class="num">${total - score - skipped}</div><div class="desc">答錯 (Incorrect)</div></div>
          <div class="stat-box"><div class="num">${skipped}</div><div class="desc">略過 (Skipped)</div></div>
          <div class="stat-box"><div class="num">${total}</div><div class="desc">總題數 (Total)</div></div>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">再測驗一次 (Try Again)</button>
        <p class="disclaimer">AZ-900 及格分數為 700/1000 (約 70%)。每次測驗題目皆會隨機排序。</p>
      </div>
    `;
  }
}

window.onAz900LangChange = function (lang) {
  renderStaticSections(lang);
  renderQuestion();
};

renderStaticSections(getLang());
startQuiz();
</script>
