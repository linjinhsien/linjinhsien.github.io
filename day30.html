  <style>

    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    header{background:linear-gradient(135deg,var(--azure-dark),var(--azure));color:#fff;padding:2rem 1.5rem 1.5rem;text-align:center;}
    .day-badge{display:inline-block;background:rgba(255,255,255,.25);border-radius:20px;padding:.25rem .9rem;font-size:.8rem;font-weight:700;letter-spacing:.1em;margin-bottom:.6rem;}

    header p{opacity:.85;font-size:.9rem;}
    .nav-links{margin-top:1rem;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;}

    .nav-link:hover{background:rgba(255,255,255,.2);}
    .progress-wrap{background:#fff;border-bottom:1px solid var(--border);padding:.6rem 1.5rem;position:sticky;top:0;z-index:10;}

    main{max-width:760px;margin:0 auto;padding:1.5rem 1rem 3rem;}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.08);padding:1.5rem;margin-bottom:1rem;}
    .qtype-badge{display:inline-block;background:var(--azure-light);color:var(--azure-dark);border-radius:12px;padding:.15rem .6rem;font-size:.72rem;font-weight:600;margin-bottom:.6rem;}
    .topic-label{font-size:.78rem;color:var(--neutral);margin-bottom:.8rem;}
    .scenario-box{background:#f8f9fa;border-left:3px solid var(--azure);border-radius:0 var(--radius) var(--radius) 0;padding:.8rem 1rem;margin-bottom:1rem;font-size:.88rem;line-height:1.6;}
    .question-text{font-size:1rem;font-weight:600;line-height:1.5;margin-bottom:1rem;}
    .options{display:flex;flex-direction:column;gap:.6rem;}

    .explanation.show{display:block;}
    .actions{margin-top:1.2rem;display:flex;gap:.75rem;flex-wrap:wrap;}
    .btn{padding:.55rem 1.2rem;border:none;border-radius:var(--radius);font-size:.9rem;cursor:pointer;font-weight:600;transition:.15s;}
    .btn-primary{background:var(--azure);color:#fff;}
    .btn-primary:hover{background:var(--azure-dark);}
    .btn-skip{background:#fff;color:var(--neutral);border:1.5px solid var(--border);}
    .btn-skip:hover{background:var(--bg);}
    .results{text-align:center;padding:2rem 1rem;}
    .score-ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--azure) 0%,var(--border) 0%);display:flex;align-items:center;justify-content:center;margin:1.5rem auto;font-size:1.6rem;font-weight:700;position:relative;}
    .score-ring::before{content:'';position:absolute;inset:12px;background:#fff;border-radius:50%;}
    .score-ring span{position:relative;z-index:1;}
    .results h2{color:var(--azure-dark);margin-bottom:.5rem;}
    .results p{color:var(--neutral);}
    .restart-btn{margin-top:1.5rem;padding:.7rem 2rem;background:var(--azure);color:#fff;border:none;border-radius:var(--radius);font-size:1rem;cursor:pointer;font-weight:700;}

<script>
const QUESTIONS=[
  {type:"Case Study",topic:"Domain 2｜Private Endpoint / Private Link",scene:"跨國醫療集團 HealthCare+ 將電子病歷（EMR）與醫學影像系統遷移至 Azure，受嚴格的 HIPAA 法規監管。醫院內部網路需存取 Azure Blob Storage 存放的 MRI 影像，合規要求：傳輸封包嚴格禁止經過公開網際網路，且 Storage Account 本體嚴禁配置任何 Public IP。",q:"【Q1A】架構師應在內部 VNet 中配置什麼端點元件？",opts:["A. Private Endpoint (Azure Private Link)","B. Service Endpoint","C. Virtual Network Gateway","D. Azure Bastion Host"],a:0,exp:"Private Endpoint 會在內部 VNet 子網路中配置一張虛擬網卡（NIC）並指派內部私有 IP，讓 VNet 內部資源透過該私有 IP 連線 PaaS 服務，完全切斷公開網際網路存取路徑，使 Storage Account 無需任何 Public IP。Service Endpoint 仍然讓 PaaS 保留公開端點，只是限縮存取來源，不符合「不配置 Public IP」的要求。"},
  {type:"Case Study",topic:"Domain 3｜Azure Key Vault（CMK 客戶管理金鑰）",scene:"HealthCare+ 病歷系統遷移（同 Q1A）。法規要求所有病歷資料在寫入磁碟時，必須使用醫院自行持有與管理的金鑰（CMK）進行靜態加密，金鑰必須具備防軟體誤刪（Soft Delete）與清除保護。",q:"【Q1B】金鑰應集中保管於哪項服務？",opts:["A. Azure Key Vault","B. Microsoft Defender for Cloud","C. Azure Blob Storage 容器中","D. Azure Resource Manager"],a:0,exp:"Azure Key Vault 是微軟的雲端金鑰管理服務，支援 Customer-Managed Keys（CMK）、HSM 硬體安全模組、Soft Delete（防誤刪）與 Purge Protection（防徹底清除）。Defender for Cloud 是安全態勢管理服務，不是金鑰保管庫。"},
  {type:"Repeated Scenario",topic:"Domain 3｜Management Group Policy Deny",scene:"大型金控集團 FinTechOne 旗下擁有 50 個 Azure Subscriptions。資安長要求：以最少管理負擔，在全企業所有 50 個 Subscriptions 範圍強制禁止建立具有公用 IP 位址（Public IP）的虛擬機器。",q:"【方案 A】在最頂層的 Management Group 上建立並指派一個原則效果為 Deny 的 Azure Policy，禁止建立任何公用 IP 資源。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:0,exp:"在最頂層 Management Group 指派 Deny 效果的 Azure Policy，所有底下的 Subscriptions 與 Resource Groups 都會自動繼承此限制。這是「以最少管理負擔在全集團強制執行」的最佳實踐，只需一次設定即涵蓋所有 50 個 Subscriptions。"},
  {type:"Repeated Scenario",topic:"Domain 3｜Resource Lock 無法阻止 Public IP 佈建",scene:"FinTechOne 全集團 50 個 Subscriptions 禁止建立具有 Public IP 的 VM（同 Q2）。",q:"【方案 B】由管理員逐一登入 50 個 Subscriptions，為每個 Subscription 內的所有 Resource Group 套用 CanNotDelete（不可刪除）資源鎖定。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"Resource Lock（CanNotDelete）只能防止資源被刪除，完全無法阻止工程師在未鎖定的空間中建立新的 Public IP 資源。此外，「逐一登入 50 個 Subscriptions」本身就違反了「最少管理負擔」的核心目標。Lock 的功能與 Policy 的功能完全不同。"},
  {type:"Repeated Scenario",topic:"Domain 2｜NSG 無法阻止 Public IP 佈建",scene:"FinTechOne 全集團禁止建立具有 Public IP 的 VM（同 Q2）。",q:"【方案 C】在各 Subscription 現有的預設 NSG 中，新增一條阻絕所有 Inbound 網際網路流量的安全規則。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"NSG 是網路流量過濾工具，負責控制進出虛擬網路的 IP/Port 封包，但完全無法阻止工程師在 Azure Resource Manager（控制平面）層建立 Public IP 資源物件。工程師仍然可以分配 Public IP，NSG 只是讓外部流量無法通過，但 Public IP 的存在本身就違反了合規要求。"},
  {type:"Drag & Drop",topic:"Domain 2｜WAF vs Azure Firewall 辨析",scene:"跨國投信企業進行雲端安全架構審查。架構防護需求包含：①NSG 基礎 IP/Port 過濾 ②Azure Bastion 管理私網 VM ③網路邊界偵測阻擋 SQL Injection / XSS 等 Layer 7 攻擊 ④跨 VNet 集中式具備完全狀態檢查（Stateful inspection）的雲端原生防火牆",q:"架構防護需求③（在網路邊界即時偵測並阻擋 SQL Injection 與 XSS 等應用程式第七層惡意攻擊）應選用哪個元件？",opts:["A. Web Application Firewall (WAF)","B. Azure Firewall","C. Network Security Group (NSG)","D. Azure Bastion"],a:0,exp:"WAF（Web Application Firewall）專門針對 HTTP/HTTPS 應用層（Layer 7）進行內容感知型過濾，能偵測並阻擋 OWASP Top 10 攻擊（SQL Injection、XSS 等）。Azure Firewall 是集中式網路防火牆，適合跨 VNet 的 Layer 3-7 封包過濾，但其核心不是 Web 攻擊特徵碼防護。"},
  {type:"Hot Area Drop-down",topic:"Domain 3｜Conditional Access 條件式存取",scene:"安全團隊設計零信任身分驗證架構。當系統偵測到使用者嘗試從未受企業 MDM 列管的個人裝置，或偵測到登入連線屬於高風險 IP 時，自動要求多因素驗證（MFA）或直接阻絕存取。",q:"【填空 1】此功能是？",opts:["A. Microsoft Entra 條件式存取（Conditional Access）","B. Microsoft Defender for Cloud","C. Azure Policy","D. 自助密碼重設（SSPR）"],a:0,exp:"Conditional Access 是 Microsoft Entra 的 If-Then 決策引擎：If（訊號：裝置合規狀態/地理位置/登入風險分數/應用程式）Then（要求 MFA / 封鎖存取 / 限制工作階段）。這是零信任架構中「明確驗證」核心支柱的具體技術實現。"},
  {type:"Hot Area Drop-down",topic:"Domain 2｜Managed Identity 受控識別",scene:"零信任身分驗證架構設計（同 Q6）。若要讓 Azure VM 內部的應用程式能夠自動向 Microsoft Entra ID 取得存取權杖以安全存取後端 Azure SQL Database，完全不需要在原始碼中存放資料庫帳號密碼或連線字串。",q:"【填空 2】應為該 VM 配置？",opts:["A. 受控識別（Managed Identity）","B. 手動建立的服務主體與密碼","C. 唯讀資源鎖定（ReadOnly Lock）","D. 連線字串環境變數"],a:0,exp:"Managed Identity（受控識別）讓 Azure 資源（如 VM、App Service）自動向 Microsoft Entra ID 取得身分，無需在代碼中維護任何憑證。應用程式使用此身分向 Key Vault 或 SQL Database 請求存取，整個過程零密碼、自動輪換，是微軟推薦的雲端原生安全最佳實踐。"},
  {type:"Build List & Reorder",topic:"Domain 1｜微軟 CAF 雲端遷移生命週期",scene:"企業遵循微軟 Cloud Adoption Framework (CAF) 執行全公司大規模上雲遷移。CAF 五大階段：①規劃評估（Plan）②策略擬定（Strategy）③治理與維運（Govern/Manage）④整備環境（Ready）⑤採用移轉（Adopt）",q:"請選出 CAF 正確的生命週期順序（由先到後）：",opts:["A. ②策略擬定 → ①規劃評估 → ④整備環境 → ⑤採用移轉 → ③治理維運","B. ①規劃評估 → ②策略擬定 → ③治理維運 → ④整備環境 → ⑤採用移轉","C. ②策略擬定 → ④整備環境 → ①規劃評估 → ⑤採用移轉 → ③治理維運","D. ①規劃評估 → ②策略擬定 → ④整備環境 → ⑤採用移轉 → ③治理維運"],a:0,exp:"CAF 標準生命週期：Strategy（確立業務動機與 ROI）→ Plan（盤點資產、Azure Migrate 評估）→ Ready（建立 Landing Zone 登陸區域）→ Adopt（正式遷移或現代化）→ Govern & Manage（持續 Policy、Cost、Security 治理）。治理在「移轉後持續執行」，不是一次性步驟。"},
  {type:"Active Screen",topic:"Domain 1｜PaaS 責任共擔 vs 彈性 vs AZ 延遲",scene:null,q:"針對以下三項雲端運算核心陳述，請選出正確的 Yes/No 組合：①在 PaaS（如 Azure App Service）架構下，客戶仍然需要負責底層 Guest OS 的安全漏洞修補與版本升級 ②彈性（Elasticity）特別強調能隨即時負載「自動動態」增加與縮減運算容量，避免資源閒置浪費 ③部署在不同 Availability Zones 的兩台 VM，網路往返延遲通常遠低於部署在不同 Azure Regions 的兩台 VM",opts:["A. ①否 ②是 ③是","B. ①是 ②是 ③是","C. ①否 ②否 ③是","D. ①是 ②否 ③否"],a:0,exp:"①No：PaaS 下微軟全責管理底層 OS 補丁，客戶只需負責應用程式代碼與資料（責任共擔模型）。②Yes：Elasticity 是雲端的核心特性，強調自動彈性伸縮。③Yes：可用性區域（AZ）位於同一城市地理範圍內，延遲通常 < 2ms；不同 Region 跨洲際可能達 100-200ms。"},
  {type:"Multiple Choice",topic:"Domain 2｜RTO 與 RPO 定義",scene:null,q:"某跨國證券交易系統的 BCP 明訂：①當發生重大災難時，交易系統必須在 15 分鐘之內全面恢復對外服務；②系統從備援環境復原時，最多只容許遺失 5 分鐘以內的交易紀錄資料。在雲端架構規劃中，這兩個指標分別稱為？",opts:["A. RTO（復原時間目標）為 15 分鐘；RPO（復原點目標）為 5 分鐘","B. RPO（復原點目標）為 15 分鐘；RTO（復原時間目標）為 5 分鐘","C. MTBF（平均故障間隔）為 15 分鐘；MTTR（平均修復時間）為 5 分鐘","D. SLA 為 15 分鐘；SLO 為 5 分鐘"],a:0,exp:"RTO（Recovery Time Objective）= 災難發生後到服務恢復的最大容許時間，即「多快恢復服務」= 15 分鐘。RPO（Recovery Point Objective）= 系統可以容忍多少資料遺失，即「資料遺失時間窗口」= 5 分鐘。這是 DR 規劃的兩大核心指標，考試高頻考點。"},
  {type:"Hot Area Graphic/UI",topic:"Domain 3｜Cost Analysis 帳單排查",scene:"財務長發現上個月 Azure 帳單研發部門費用暴增 45%，需要「依據資源群組、部門 Tags 以及特定服務類型篩選每日花費明細趨勢，並將分析數據匯出至 Excel」。財務長在 Azure 入口網站開啟 Cost Management + Billing 服務後。",q:"應點選哪一個功能選項？",opts:["A. Budgets（預算）","B. Cost analysis（成本分析）","C. Cost alerts（成本警示）","D. Payment methods（付款方式）"],a:1,exp:"Cost Analysis（成本分析）是互動式的費用探索工具，支援依資源群組、Tags、服務類型、時間維度進行多維度篩選與視覺化，並可將結果匯出為 Excel/CSV。Budgets 是設定預算上限，Cost Alerts 是設定警示通知，都不是用來「探索與分析」歷史費用明細的工具。"},
  {type:"Best Answer",topic:"Domain 2｜Docker 容器 PaaS 無 K8s 管理",scene:null,q:"某票務平台即將舉辦天王演唱會，預估每秒數萬次並行請求。要求：①應用程式已打包為 Docker 容器映像檔 ②全自動水平調整（Autoscale）③內建整合自訂網域名稱與免費自動續約 SSL/TLS 憑證 ④完全不需要管理或調校 Kubernetes 叢集、節點集區或控制平面。哪項 Azure PaaS 服務是最佳解？",opts:["A. Azure App Service（Web App for Containers）","B. Azure Virtual Machines","C. Azure Kubernetes Service (AKS)","D. Azure Dedicated Host"],a:0,exp:"App Service（Web App for Containers）接受 Docker 映像檔直接部署，內建 Autoscale、自訂網域與免費 SSL 憑證管理，完全無需工程師維護 Kubernetes 叢集與節點。AKS 雖然支援容器，但需要管理節點集區（Node Pools），不符合「不需管理 K8s 叢集」的要求。"},
  {type:"Multiple Response",topic:"Domain 3｜Azure RBAC 核心規則（選 2 項）",scene:null,q:"以下關於 Azure RBAC 的敘述中，哪兩項是完全正確的？",opts:["A. 加法模型（Additive）：多角色有效權限為聯集 + B. 存在 Deny Assignment 時，Deny 絕對優先於 Allow","A. 加法模型 + C. RBAC 可以限制 VM「每晚 10 點禁止開機」","B. Deny overrides Allow + D. Management Group RBAC 不被 Subscription 繼承","C. RBAC 限制開機時間 + E. Contributor 具備授權他人的能力"],a:0,exp:"A正確：Azure RBAC 採用加法模型，當使用者擁有多個角色時，有效權限是所有角色的聯集。B正確：Deny Assignment 明確拒絕的優先級高於任何允許授權（Deny overrides Allow）。C錯誤：RBAC 無法設定時間限制開機，需要用 Azure Automation 或 Schedule。D錯誤：Management Group 的 RBAC 指派會被底下 Subscription 繼承。E錯誤：Contributor 不能管理其他使用者的存取權（那是 Owner 的能力）。"},
  {type:"Repeated Scenario",topic:"Domain 2｜Private Endpoint 正確阻隔公網",scene:"某晶圓製造廠核心製程專利圖紙存放於 Azure Storage Account 的 Blob 容器。核心目標：確保 Storage Account 只能由廠區內部指定的 VNet 私有存取，嚴格禁止任何來自公開網際網路的連線嘗試。",q:"【方案 A】在 Storage Account 的網路設定中，關閉公用網路存取（Disabled），並建立一個 Private Endpoint 綁定至廠區的內部 VNet 子網路。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:0,exp:"「關閉公用網路存取」+ Private Endpoint 是完美組合：①關閉公網確保任何來自 Internet 的連線請求都被拒絕；②Private Endpoint 在指定 VNet 子網路中配置私有 IP，讓廠區 VNet 內部資源透過私有 IP 直接存取 Storage，流量完全不離開微軟骨幹私網。"},
  {type:"Repeated Scenario",topic:"Domain 3｜ReadOnly Lock 無法控制網路存取",scene:"晶圓廠 Storage Account 只能由廠區 VNet 私有存取，禁止 Internet 連線（同 Q13）。",q:"【方案 B】在 Storage Account 資源上套用 ReadOnly（唯讀）的 Resource Lock。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"ReadOnly Lock 只能防止對資源屬性的修改，完全無法控制「誰能透過網路連線存取」資源內的資料。套用 ReadOnly Lock 後，來自公開網際網路的存取嘗試依然照常成功（只要有合法的存取金鑰或 SAS）。Lock 是控制平面的操作限制，不是資料平面的網路存取控制。"},
  {type:"Repeated Scenario",topic:"Domain 2｜SAS Token 仍走公開 Internet",scene:"晶圓廠 Storage Account 只能由廠區 VNet 私有存取，禁止 Internet 連線（同 Q13）。",q:"【方案 C】為 Storage Account 產生一個具備 24 小時有效期的 Shared Access Signature (SAS) Token，並通知工程師透過公開網際網路連線存取。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"SAS Token 是資料存取憑證（認證 Token），提供受時間限制的精細授權，但不能改變連線路徑。使用 SAS Token 透過公開 Internet 連線正是核心目標明確禁止的行為。此方案完全違反「禁止 Internet 連線」的要求，是反向答案。"},
  {type:"Drag & Drop",topic:"Domain 3｜Azure Service Health vs Activity Log 辨析",scene:"維運監控情境包含：①即時追蹤 VM CPU/記憶體計量並設警示 ②稽核查詢誰在 90 天內刪除了網路資源 ③查詢微軟全球 Azure 基礎結構重大故障對本公司名下特定資源的實質影響 ④深入分析 Web 應用程式例外狀況與後端效能",q:"維運監控情境③（查詢微軟官方服務中斷對自己名下資源的實質影響與維護排程）應選用？",opts:["A. Azure Service Health","B. Azure Monitor Metrics","C. Azure Activity Log","D. Application Insights"],a:0,exp:"Azure Service Health 提供個人化服務中斷通報，顯示微軟事故對「你自己的特定資源」的實質衝擊，包含服務中斷通知、計畫性維護、服務建議與健康狀態摘要。Azure Monitor Metrics 是計量追蹤工具；Activity Log 記錄資源管理操作歷史；Application Insights 是應用程式效能監控。"},
  {type:"Build List & Reorder",topic:"Domain 3｜Azure Budget Alert 建立流程",scene:"財務與維運團隊需要在 Azure 中建立「月度支出超標警示」。步驟：①指定預算的作用範圍（Scope）②設定預算名稱、週期與金額上限 ③設定觸發警示的百分比閾值 ④設定通知接收者 Email 並關聯 Action Group",q:"請選出在 Azure 入口網站建立 Budget Alert 的正確操作順序：",opts:["A. ①指定範圍 → ②設定名稱金額 → ③設定閾值 → ④設定通知","B. ②設定名稱金額 → ①指定範圍 → ③設定閾值 → ④設定通知","C. ①指定範圍 → ③設定閾值 → ②設定名稱金額 → ④設定通知","D. ③設定閾值 → ①指定範圍 → ②設定名稱金額 → ④設定通知"],a:0,exp:"建立 Budget Alert 的標準流程：①首先選擇預算作用的範圍（Subscription 或 Resource Group）→②設定預算名稱、重設週期（月/季/年）與金額上限→③設定觸發警示的百分比條件（如 80% 實際、100% 預測）→④設定通知收件人 Email 並可選擇性綁定 Action Group 執行自動化動作。"},
  {type:"Case Study",topic:"Domain 2｜Azure CDN / Front Door 邊緣加速",scene:"全球影音串流服務 StreamWorld 需服務數百萬名全球觀影用戶，正進行全球化架構升級。",q:"【Q18A】為了在使用者點閱影片宣傳海報與靜態頁面時，將內容由離使用者地理位置最近的實體邊緣節點（POP）高速交付，降低主伺服器負荷並消除跨洋延遲，應採用哪項服務？",opts:["A. Azure Front Door / Azure CDN","B. Azure Virtual Network NAT","C. Azure ExpressRoute","D. Azure Dedicated Host"],a:0,exp:"Azure CDN（含 Azure Front Door）將靜態內容快取至全球 POP 邊緣伺服器，使用者從最近的邊緣節點取得內容，大幅降低延遲與來源伺服器負荷。ExpressRoute 是企業地端與 Azure 的專線連接，Dedicated Host 是物理伺服器隔離，完全無關邊緣加速。"},
  {type:"Case Study",topic:"Domain 2｜Azure Event Hubs 海量串流事件引入",scene:"StreamWorld 全球影音串流平台升級（同 Q18A）。",q:"【Q18B】平台需要即時接收全球數百萬個連線裝置每秒回傳的觀影心跳紀錄（Heartbeat Telemetry），每秒資料量高達數十萬筆事件，專門負責海量串流事件引入（Ingestion）的服務是？",opts:["A. Azure Event Hubs","B. Azure Queue Storage","C. Azure Service Bus 佇列","D. Azure Notification Hubs"],a:0,exp:"Event Hubs 是設計用於每秒百萬筆事件的大吞吐量串流資料「引入管道（Ingestion Gateway）」，適合遙測、日誌、點擊流等高速事件串流，支援 Apache Kafka 協定。Service Bus 適合企業訊息中介（需要 FIFO、重複偵測），Event Grid 是事件驅動架構，Queue Storage 是簡單 FIFO 佇列，都無法達到 Event Hubs 的吞吐量規模。"},
  {type:"Hot Area Drop-down",topic:"Domain 2｜ZRS 儲存體備援 — 三個可用性區域同步",scene:"企業合規主管審核儲存體容錯備援能力。某商業銀行核心交易憑據必須在主要區域的三個 Availability Zones（可用性區域）進行同步複寫，以抵禦單一資料中心火災中斷。",q:"【填空 1】應配置哪種備援選項？",opts:["A. Zone-redundant storage (ZRS)","B. Locally redundant storage (LRS)","C. Geo-redundant storage (GRS)","D. Read-access Geo-redundant storage (RA-GRS)"],a:0,exp:"ZRS（區域備援儲存體）在同一主要區域的三個 Availability Zones 進行同步資料複製，每個 Zone 在獨立電力與冷卻的不同資料中心，能夠承受單一整座資料中心的火災斷電而不遺失資料。LRS 只在單一資料中心內 3 份複本，不能承受整座資料中心損毀。"},
  {type:"Hot Area Drop-down",topic:"Domain 2｜RA-GZRS 跨區域 + 次要區域唯讀",scene:"儲存體備援需求（同 Q19-填空1）。法規進一步要求：除了主要區域的三個可用性區域外，資料還必須跨地理區域非同步複寫至數百英里外的次要區域，且在次要區域必須隨時提供唯讀存取。",q:"【填空 2】應選擇哪種備援選項？",opts:["A. Read-access Geo-zone-redundant storage (RA-GZRS)","B. Read-access Geo-redundant storage (RA-GRS)","C. Locally redundant storage (LRS)","D. Zone-redundant storage (ZRS)"],a:0,exp:"RA-GZRS = Read-Access Geo-Zone-Redundant Storage：①主要區域的 3 個 AZ 同步複寫（ZRS 等級）②跨地理配對區域非同步複寫 ③次要區域提供唯讀端點。RA-GRS 在次要區域也有唯讀，但主要區域只用 LRS（單一資料中心 3 份複本），不具備 ZRS 的抗 AZ 損毀能力。"},
  {type:"Multiple Choice",topic:"Domain 2｜Azure Service Bus FIFO + 重複偵測",scene:null,q:"某金融轉帳系統要求訊息佇列必須：①嚴格先進先出（FIFO）的訊息處理順序 ②內建重複訊息偵測（Duplicate detection）以防重複扣款 ③支援異質系統間的交易性訊息發送（Transactional Messaging）。哪項 Azure 訊息服務最符合此需求？",opts:["A. Azure Service Bus（佇列與主題）","B. Azure Event Grid","C. Azure Event Hubs","D. Azure Notification Hubs"],a:0,exp:"Azure Service Bus 是企業級訊息中介服務（Message Broker），原生支援 FIFO、重複訊息偵測、Dead-Letter Queue、Transaction 交易群組等進階特性，專為高可靠性企業訊息傳遞設計。Event Grid 是事件路由（Push 發布/訂閱），Event Hubs 是高吞吐量串流引入，都不具備 FIFO + 重複偵測的完整企業訊息功能。"},
  {type:"Active Screen",topic:"Domain 2｜Azure VNet 核心規則",scene:null,q:"評估 Azure 虛擬網路的底層運作邏輯，請選出正確的 Yes/No 組合：①一個子網路（Subnet）可以同時直接關聯兩個或更多個不同的 NSG ②透過 VNet Peering 建立私有互通的兩個 VNet，其 IP 位址空間（CIDR）絕對不能重疊 ③部署在 Azure VNet 內的虛擬機器，在沒有配置 Public IP 的情況下，預設仍然具備對公開網際網路的出站（Outbound）連線能力",opts:["A. ①否 ②是 ③是","B. ①是 ②是 ③否","C. ①否 ②否 ③是","D. ①否 ②是 ③否"],a:0,exp:"①No：一個 Subnet 只能直接關聯「一個」NSG（但可以有 Subnet NSG 和 NIC NSG 的雙重保護）。②Yes：VNet Peering 要求兩端的 CIDR 位址空間完全不重疊，這是配置 Peering 的強制前提條件。③Yes：預設情況下，VNet 內的 VM 透過 Azure 的共享 NAT 出口具備 Internet 出站連線能力，無需額外配置。"},
  {type:"Best Answer",topic:"Domain 2｜Cosmos DB 全球多區域寫入",scene:null,q:"某跨國飯店預訂平台要求：無論旅客身在北美、歐洲或亞太地區，訂房寫入操作都必須在「當地的資料中心以個位數毫秒延遲」完成，且資料庫必須原生支援「全域多區域同時寫入（Multi-region writes）」，並提供高達 99.999% 可用性 SLA。哪項 Azure 資料庫服務是唯一滿足條件的解決方案？",opts:["A. Azure Cosmos DB","B. Azure SQL Database（單一資料庫）","C. Azure Database for MySQL 彈性伺服器","D. Azure SQL Managed Instance"],a:0,exp:"Azure Cosmos DB 是微軟的全球分佈式多模型資料庫，原生支援多區域同時寫入（Multi-master/Multi-region writes）、毫秒級個位數讀寫延遲、99.999% 可用性 SLA，以及多種 NoSQL API（Document/MongoDB/Cassandra/Gremlin/Table）。其他選項都是關聯式資料庫，不支援全球多區域同時寫入架構。"},
  {type:"Repeated Scenario",topic:"Domain 2｜單一 VM 無法達到 99.99% SLA",scene:"某電商核心訂單服務部署在 Azure VM。核心目標：架構必須達到微軟官方具備財務賠償保證的 99.99%（四個九）SLA。",q:"【方案 A】部署單一台規格為 Standard_E8s_v5 的獨立虛擬機器，並掛載頂級 Ultra Disk 作為 OS 開機磁碟。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"單一 VM（Single VM），即使掛載 Premium SSD 或 Ultra Disk，微軟官方 SLA 最高也只有 99.9%（三個九），每年允許停機約 8.76 小時。Ultra Disk 可以提升 I/O 效能，但不提升機器本身的可用性。要達到 99.99% 必須部署多台 VM 且跨 Availability Zones。"},
  {type:"Repeated Scenario",topic:"Domain 2｜Availability Set 只達 99.95% SLA",scene:"電商核心訂單服務需達到官方 99.99% SLA（同 Q23）。",q:"【方案 B】將兩台或更多台相同的 VM 部署在同一個資料中心內部的 Availability Set（可用性設定組）中。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"Availability Set 內的 VM 跨不同 Fault Domain（機架）與 Update Domain（維護批次），微軟 SLA 為 99.95%（每年允許停機約 4.38 小時），仍低於 99.99% 的目標。此外，Availability Set 內所有 VM 都在同一個資料中心，若整棟建築斷電或大火會全數中斷。"},
  {type:"Repeated Scenario",topic:"Domain 2｜Availability Zones 達到 99.99% SLA",scene:"電商核心訂單服務需達到官方 99.99% SLA（同 Q23）。",q:"【方案 C】將兩台或更多台 VM 分散跨部署在同一個 Azure 區域內的多個 Availability Zones（可用性區域）中。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:0,exp:"跨 Availability Zones 部署的 VM，微軟官方 SLA 為 99.99%（四個九，每年允許停機約 52.6 分鐘），完全達成核心目標。每個 AZ 是物理上彼此隔離的獨立資料中心，即使一整個 AZ 損毀，其他 AZ 的 VM 仍可無縫接管。這是達到 99.99% SLA 的唯一正確方案。"},
  {type:"Drag & Drop",topic:"Domain 3｜Azure DDoS Protection 核心職責",scene:"資安防禦服務的核心職責：①集中保管密碼、API 金鑰與憑證，支援 HSM ②CSPM 雲端安全態勢管理，持續評估弱點並計算 Secure Score ③針對公開 IP 提供全自動常態啟用的流量清洗防禦，保護資源免於大規模洪水攻擊 ④雲端原生 SIEM/SOAR，跨多雲收集日誌並自動執行應變劇本",q:"資安職責③（針對公開 IP 提供全自動常態啟用的 DDoS 流量清洗防禦）應選用？",opts:["A. Azure DDoS Protection","B. Microsoft Defender for Cloud","C. Azure Key Vault","D. Microsoft Sentinel"],a:0,exp:"Azure DDoS Protection Standard 提供常態啟用的流量監控與 AI 機器學習自動清洗，能防禦 L3/L4 層的 DDoS 攻擊（SYN Flood、UDP Amplification 等），並提供攻擊指標遙測。Defender for Cloud 是 CSPM/CWPP，Key Vault 是金鑰管理，Sentinel 是 SIEM，三者都不是 DDoS 防禦工具。"},
  {type:"Multiple Choice",topic:"Domain 1｜Consumption-based Model 隨用隨付",scene:null,q:"某 AI 新創團隊在 Azure 上運行大規模模型推論服務。在業務淡季或離峰時段，微服務無任何任務請求，當月伺服器運算費用幾乎趨近於零；在尖峰期流量暴增時，系統自動擴充數百個執行個體並依實際執行秒數付費。這種「依實際使用量計費，無用量即無費用」的特性屬於雲端運算的哪種核心模型？",opts:["A. Consumption-based model（隨用隨付 / 消耗型模型）","B. Fixed CapEx model（固定資本支出模型）","C. Pre-paid Hardware Allocation（預付硬體配置）","D. Static Capacity Provisioning（靜態容量配置）"],a:0,exp:"Consumption-based model（消耗型計費模型）是雲端運算的核心財務優勢，使用多少付多少，不用時費用為零。這與地端自建機房的 Fixed CapEx 模型（無論有無使用都要負擔折舊與電費）形成鮮明對比。Azure Functions Consumption Plan 就是此模型的最佳實踐範例。"},
  {type:"Hot Area Graphic/UI",topic:"Domain 3｜Defender for Cloud Secure Score",scene:"資安長要求工程人員每週審核 Azure 環境的合規態勢，並依照建議優先修補漏洞，以提升整個組織的 Secure Score（安全分數）。",q:"工程人員應在 Azure 入口網站中開啟哪一項服務的儀表板來查看該數值？",opts:["A. Microsoft Defender for Cloud","B. Microsoft Intune","C. Azure Service Health","D. Azure Network Watcher"],a:0,exp:"Microsoft Defender for Cloud 的核心功能之一就是 Secure Score（安全分數），提供整個 Azure 環境的安全態勢量化分數（0-100），並列出具體的安全建議與優先修復項目。Intune 是行動裝置管理工具，Service Health 是服務中斷追蹤，Network Watcher 是網路診斷工具。"},
  {type:"Case Study",topic:"Domain 2｜Azure IoT Hub 雙向管理 + 裝置身分",scene:"某智慧製造大廠 SmartFactory 擁有 15,000 台產線感測設備。",q:"【Q30A】系統需要一個具備「雙向通訊、裝置身分註冊管理與高安全性憑證認證」的雲端中樞，能即時管理這 15,000 台設備並接收其遙測數據，應選擇？",opts:["A. Azure IoT Hub","B. Azure Event Grid","C. Azure Service Bus","D. Azure Notification Hubs"],a:0,exp:"Azure IoT Hub 是專為 IoT 裝置設計的雲端閘道，支援：裝置到雲端（D2C）與雲端到裝置（C2D）雙向通訊、裝置身分登錄（Device Registry）、X.509/SAS 憑證認證、孿生裝置（Device Twin）管理。Event Grid 是事件路由，Service Bus 是訊息中介，Notification Hubs 是推播通知，都不具備 IoT 裝置管理能力。"},
  {type:"Case Study",topic:"Domain 2｜Azure Stream Analytics 即時視窗彙總",scene:"SmartFactory 智慧製造廠 IoT 平台（同 Q30A）。",q:"【Q30B】資料團隊需要對每秒湧入的大量溫度感測串流資料進行「每 10 秒平均溫度」的即時無伺服器視窗彙總（Windowing Aggregation），並在超過臨界值時立即發出警示，應選用哪項服務？",opts:["A. Azure Stream Analytics","B. Azure Data Factory","C. Azure Synapse Analytics","D. Azure Storage Tables"],a:0,exp:"Azure Stream Analytics 是完全受管的即時串流分析服務，原生支援 SQL 語法的時間視窗函數（Tumbling/Hopping/Sliding Window），能對即時串流資料執行彙總計算並觸發輸出警示。Data Factory 和 Synapse 是批次處理/ETL 工具，不適合毫秒級即時串流計算。"},
  {type:"Multiple Response",topic:"Domain 2｜HA vs DR 本質差異（選 2 項）",scene:null,q:"以下關於高可用性（HA）與災難復原（DR）的敘述中，哪兩項是完全正確的？",opts:["A. HA 確保系統面臨單一組件故障時持續運作 + B. DR 強調在重大毀滅性災難後從異地備份迅速復原","A. HA + C. 搬遷至 Azure 自動取得 100% 永不中斷保證","B. DR + D. Fault Domain 主要用來防止軟體程式碼錯誤","C. 100% 保證 + E. Update Domain 是為了防範地震海嘯地理災害"],a:0,exp:"A正確：HA（高可用性）目標是在組件故障（硬碟損壞、機架斷電）時無縫切換，最小化停機時間。B正確：DR（災難復原）目標是在大規模區域性災難後，從異地備份恢復服務與資料（關注 RTO/RPO）。C錯誤：無任何技術能保證 100% 可用性。D錯誤：Fault Domain 防範實體硬體（機架/電力）單點失敗，不防程式錯誤。E錯誤：Update Domain 是維護滾動更新批次，與地理災害無關。"},
  {type:"Hot Area Drop-down",topic:"Domain 3｜Bicep IaC 宣告式語言",scene:"DevOps 團隊評估 Azure 自動化管理工具。微軟官方針對 Azure 原生開發的宣告式基礎結構即程式碼（IaC）領域專用語言，比傳統 ARM JSON 範本擁有更簡潔的語法並原生提供型別檢查。",q:"【填空 1】這個工具是？",opts:["A. Bicep","B. Terraform","C. Ansible","D. PowerShell DSC"],a:0,exp:"Bicep 是微軟官方推出的 Azure 原生 IaC 領域專用語言（DSL），是 ARM Template（JSON）的抽象語法糖，提供更簡潔的宣告式語法、型別安全、模組化重用與更好的 VS Code 智能感知支援。Terraform 雖然也是 IaC 工具但不是「微軟官方針對 Azure 原生開發」的。"},
  {type:"Hot Area Drop-down",topic:"Domain 3｜Azure Cloud Shell 瀏覽器內建終端機",scene:"DevOps 團隊評估 Azure 自動化管理工具（同 Q32）。在瀏覽器中直接開啟、預載了最新版 Azure CLI 與 PowerShell 的互動式終端機環境。",q:"【填空 2】這個工具是？",opts:["A. Azure Cloud Shell","B. Azure Bastion","C. Azure Virtual Desktop","D. Windows Terminal（本機安裝版）"],a:0,exp:"Azure Cloud Shell 是內嵌於 Azure Portal 的瀏覽器型互動式終端機，預載並自動維護最新版 Azure CLI、Azure PowerShell、kubectl、git 等工具，使用者儲存個人化設定於 Storage Account，無需在本機安裝任何工具即可隨時管理 Azure 資源。"},
  {type:"Best Answer",topic:"Domain 2｜S2S VPN 作為 ExpressRoute 經濟型備援",scene:null,q:"某跨國大型銀行透過 10 Gbps 的 Azure ExpressRoute 連接總部與 Azure。為防止電信商實體線路意外中斷，銀行要求配置一個「符合成本效益的自動容錯移轉（Failover）備援通道」，當專線中斷時能自動接手流量。最推薦且符合經濟效益的備援架構是？",opts:["A. 建立一個透過公開網際網路連線的 Site-to-Site (S2S) VPN Gateway 作為備援通道","B. 向另一家電信商再申請一條 100 Gbps 的 ExpressRoute 專線","C. 部署 Azure Front Door 進行全域路由","D. 為每位員工配置 Point-to-Site VPN"],a:0,exp:"S2S VPN 透過公開 Internet 建立 IPsec 加密通道，作為 ExpressRoute 專線的成本有效備援是 Microsoft 官方推薦的最佳實踐。當 ExpressRoute 中斷時，BGP 路由自動切換至 VPN 通道，雖然頻寬與延遲不如 ExpressRoute，但能維持基本連通性。再申請一條 ExpressRoute 成本極高，不符合「符合成本效益」的要求。"},
  {type:"Repeated Scenario",topic:"Domain 3｜Azure Policy Deny 強制地理限制",scene:"某歐洲健康保險機構受 GDPR 管轄，合規政策明定：集團內所有客戶個人隱私資料與運算資源，僅允許建立在歐盟境內（West Europe 與 North Europe）。核心目標：強制阻斷任何員工在歐盟以外的任何 Azure 區域建立運算或儲存資源。",q:"【方案 A】在最頂層管理群組指派內建的「Allowed Locations」Azure Policy，將參數限定為 West Europe 與 North Europe，原則效果設為 Deny。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:0,exp:"在最頂層 Management Group 指派 Deny 效果的 Allowed Locations Policy，能在 Azure 控制平面層面阻擋所有在歐盟以外區域建立資源的請求（建立時即拒絕，不是事後稽核）。這是 GDPR 資料主權合規的標準技術實現方案，完全達成核心目標。"},
  {type:"Repeated Scenario",topic:"Domain 3｜Tags 不能強制限制部署區域",scene:"歐洲健康保險機構 GDPR 合規（同 Q34）。強制阻斷員工在歐盟以外區域建立資源。",q:"【方案 B】要求所有專案經理在建立任何資源群組時，手動在該群組上打上 Geography: Europe 的資源標記（Tags）。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"Tags（資源標記）是用於組織、分類與成本歸屬的中繼資料標籤，完全沒有強制執行或限制資源部署位置的能力。打上 'Geography: Europe' 標記不會阻止任何人在亞洲或美洲建立資源，Tags 只是資訊標記，不是控制工具。此外依賴人工手動打標籤也容易遺漏，根本不能達成「強制阻斷」的目標。"},
  {type:"Repeated Scenario",topic:"Domain 3｜Policy Audit 不阻止部署只稽核",scene:"歐洲健康保險機構 GDPR 合規（同 Q34）。強制阻斷員工在歐盟以外區域建立資源。",q:"【方案 C】在訂用帳戶指派「Allowed Locations」Azure Policy，但將原則效果（Effect）設定為 Audit。這項方案是否達成核心目標？",opts:["A. Yes — 方案達成目標","B. No — 方案未達成目標","C. 部分達成，但有副作用","D. 需要額外步驟才能達成"],a:1,exp:"Audit 效果只會在「合規性儀表板」中將不合規資源標記為 Non-compliant，但完全不阻止資源建立！工程師仍然可以在歐盟以外建立資源，只是事後會出現在合規報告中。要「阻斷」必須使用 Deny 效果。Audit vs Deny 是 AZ-900 Policy 考試的最高頻陷阱。"},
  {type:"Drag & Drop",topic:"Domain 3｜Entra B2C（消費者）vs B2B（企業夥伴）",scene:"四種身分識別需求：①允許全球終端一般消費者使用個人 Google 帳號或 Email 註冊登入公司行動購物 App ②邀請外部合作會計師事務所審計人員，使用其事務所原有 Microsoft 365 公司帳號登入 ③將企業地端 Windows Server AD DS 帳號密碼自動同步至雲端 Entra ID ④允許員工忘記密碼時，透過手機 SMS 自助重設密碼，免去致電 IT 服務台",q:"身分識別需求①（允許全球終端一般消費者使用個人 Google / LINE / Email 帳號登入公司購物 App）應使用？",opts:["A. Microsoft Entra External ID（for Customers / B2C）","B. Microsoft Entra B2B 共同作業","C. Microsoft Entra Connect","D. 自助密碼重設（SSPR）"],a:0,exp:"Entra External ID for Customers（前身 Azure AD B2C）是面向「消費者（Customer）」的 CIAM 平台，允許外部一般使用者使用 Google、Facebook、LINE 或自訂 Email 帳號進行社群登入。B2B 是面向「企業合作夥伴（Business Partners）」讓他們使用公司帳號協作，兩者適用對象完全不同。"},
  {type:"Active Screen",topic:"Domain 2｜Blob 儲存體生命週期管理辨析",scene:null,q:"針對 Azure Blob Storage 生命週期管理與存取規則，請選出正確的 Yes/No 組合：①透過 Lifecycle Management 規則，系統可在檔案 30 天未被讀取時自動轉移至 Cool 層，並在 180 天後自動轉移至 Archive 層 ②Azure Storage 支援使用 Microsoft Entra ID 認證（Azure RBAC）取代傳統的儲存體帳戶金鑰，以達到最少權限治理 ③存放在 Archive（封存）層的檔案，可以在毫秒級極短時間內直接透過公開 URL 在瀏覽器中下載開啟",opts:["A. ①是 ②是 ③否","B. ①是 ②否 ③是","C. ①否 ②是 ③否","D. ①是 ②是 ③是"],a:0,exp:"①Yes：Lifecycle Management 規則可依「最後修改時間」或「最後存取時間」自動轉移存取層，是 Azure Storage 的原生功能。②Yes：Azure Storage 完整支援 RBAC（如 Storage Blob Data Reader/Contributor），比帳戶金鑰更安全且符合最少權限原則。③No：Archive 層資料處於離線狀態，直接存取前必須先「解凍（Rehydration）」至 Hot/Cool，需耗時最少 1 小時，無法毫秒級存取。"},
  {type:"Multiple Choice",topic:"Domain 2｜Azure DevOps CI/CD 與 SDLC 平台",scene:null,q:"某跨國軟體公司需要為 300 名研發人員建置現代化開發維運環境，需求包含：敏捷看板（Kanban）、Git 原始碼託管儲存庫、全自動 CI/CD 建置管線（Pipelines）以及跨平台的套件存放庫（Artifacts）。最符合此全方位軟體開發生命週期（SDLC）的微軟平台是？",opts:["A. Azure DevOps","B. Azure Monitor","C. Azure Dev/Test Labs","D. Azure App Service"],a:0,exp:"Azure DevOps 是微軟全方位 SDLC 平台，整合 Boards（敏捷看板/Scrum）、Repos（Git 儲存庫）、Pipelines（CI/CD）、Test Plans（測試管理）與 Artifacts（套件管理）。Azure Monitor 是監控服務，Dev/Test Labs 是測試環境管理，App Service 是 Web 應用程式主機，都不是完整 SDLC 工具鏈。"},
  {type:"Hot Area Graphic/UI",topic:"Domain 2｜Application Insights Application Map",scene:"某微服務系統發生了偶發性的 HTTP 504 逾時錯誤。軟體架構師需要開啟一個可視化拓撲圖表，查看「前端網頁、中層 API 服務、後端資料庫以及第三方外部 REST 端點之間的相依呼叫關係圖與各段延遲時間」。",q:"架構師應在 Azure Portal 的 Application Insights 頁面中點選哪一個功能選單？",opts:["A. Application Map（應用程式對應）","B. Live Metrics（即時計量）","C. Failures（失敗）","D. Smart Detection（智慧偵測）"],a:0,exp:"Application Map（應用程式對應）以視覺化拓撲圖呈現微服務架構中所有元件間的相依呼叫關係，每個節點顯示請求率、失敗率與平均回應時間，能快速定位是哪個服務或外部依賴造成 504 逾時。Live Metrics 是即時 CPU/記憶體/請求數，Failures 是彙整的錯誤清單，Smart Detection 是自動異常偵測。"},
  {type:"Best Answer",topic:"Domain 2｜Azure Dedicated Host 物理隔離合規",scene:null,q:"某國防科技專案要求將機密運算系統部署至 Azure。國防部稽核條款明文規定：「運算實體主機的 CPU、記憶體與伺服器主機板，絕對不可與任何其他外部組織租戶共享」，但團隊仍希望保留透過 Azure 控制台自由建立與調整 VM 的雲端靈活性。哪項 Azure 服務是唯一完全符合此物理硬體專屬隔離合規的選擇？",opts:["A. Azure Dedicated Host","B. Azure Virtual Machines（標準執行個體）","C. Azure App Service 獨立層（Isolated Tier）","D. Azure Kubernetes Service (AKS)"],a:0,exp:"Azure Dedicated Host 讓客戶租用完整的物理伺服器主機（Host），所有在該主機上建立的 VM 確保 CPU、記憶體、磁碟控制器等硬體層面的物理隔離，不與任何其他 Azure 訂閱的工作負載共享實體硬體。標準 Azure VM 是多租戶架構（Multi-tenant），即使有強大的 hypervisor 隔離，也不能保證物理硬體不被他人共用。"},
  {type:"Multiple Response",topic:"Domain 1｜雲端經濟學效益分析（選 2 項）",scene:null,q:"以下關於企業全面搬遷至 Azure 公有雲的商業經濟效益的敘述中，哪兩項是完全正確的？",opts:["A. 規模經濟（Economies of scale）讓企業以低於自建機房的單位成本享有世界級基礎結構 + B. 消除自建機房的長期設施租賃、UPS、空調與實體警衛費用","A. 規模經濟 + C. 雲端合約保證未來 10 年服務規格租賃價格永久固定不變","B. 消除設施成本 + D. 遷移至雲端後不再需要任何軟體工程師","C. 固定價格 + E. 所有地端舊版軟體上雲後自動提升 10 倍效能"],a:0,exp:"A正確：規模經濟（Economies of Scale）是雲端的核心定價優勢，微軟以龐大採購量壓低硬體與電力單價，讓一般企業享有遠低於自建機房的運算成本。B正確：上雲後企業免除機房實體設施（土地、電力、空調、UPS、人工警衛、滅火設備）的龐大持續性固定成本。C/D/E 都是明顯錯誤的誇大說法。"},

let order=[],current=0,score=0,skipped=0;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function startQuiz(){order=shuffle([...Array(QUESTIONS.length).keys()]);current=0;score=0;skipped=0;renderQuestion();}

function updateProgress(){
  const pct=Math.round((current/QUESTIONS.length)*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressText').textContent=`題目 ${current} / ${QUESTIONS.length}`;
  document.getElementById('scoreText').textContent=`得分：${score}`;
}

function renderQuestion(){
  updateProgress();
  if(current>=QUESTIONS.length){showResults();return;}
  const q=QUESTIONS[order[current]];
  const main=document.getElementById('main');
  main.innerHTML='';
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`
    <div class="qtype-badge">${q.type}</div>
    <div class="topic-label">${q.topic}</div>
    ${q.scene?`<div class="scenario-box">${q.scene}</div>`:''}
    <div class="question-text">Q${current+1}. ${q.q}</div>
    <div class="options">${q.opts.map((o,i)=>`<button class="opt-btn" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="explanation" id="exp"></div>
    <div class="actions">
      <button class="btn btn-skip" id="skipBtn" onclick="skipQuestion()">跳過</button>
    </div>`;
  main.appendChild(card);
  card.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>selectAnswer(parseInt(btn.dataset.i),q));
  });
}

function selectAnswer(i,q){
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(i===q.a?'correct':'wrong');
  if(i!==q.a)btns[q.a].classList.add('correct');
  if(i===q.a)score++;
  const exp=document.getElementById('exp');
  exp.textContent=q.exp;
  exp.classList.add('show');
  document.getElementById('skipBtn').textContent='下一題';
  document.getElementById('skipBtn').onclick=nextQuestion;
}

function skipQuestion(){skipped++;nextQuestion();}

function nextQuestion(){current++;renderQuestion();}

function showResults(){
  document.getElementById('progressWrap').style.display='none';
  const pct=Math.round((score/QUESTIONS.length)*100);
  document.getElementById('main').innerHTML=`<div class="results card">
    <h2>Day 30 終局戰完成！</h2>
    <div class="score-ring" style="background:conic-gradient(var(--azure) ${pct}%,var(--border) 0%)"><span>${pct}%</span></div>
    <p>答對 ${score} 題 / 共 ${QUESTIONS.length} 題${skipped>0?`（跳過 ${skipped} 題）`:''}</p>
    <p style="margin-top:.5rem;font-size:.85rem;color:var(--neutral)">${pct>=70?'🎉 達到 AZ-900 合格標準（70%）！恭喜完成鐵人賽終局戰！':'💪 繼續練習，目標 70% 合格！'}</p>
    <button class="restart-btn" onclick="startQuiz()">重新挑戰</button>
  </div>`;
}

startQuiz();
</script>
