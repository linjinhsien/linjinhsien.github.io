<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZ-900 情境題練習</title>
  <style>
    :root {
      --azure: #0078d4;
      --azure-dark: #005a9e;
      --azure-light: #d0e8f8;
      --correct: #107c10;
      --correct-bg: #dff6dd;
      --wrong: #c50f1f;
      --wrong-bg: #fde7e9;
      --neutral: #605e5c;
      --bg: #f3f2f1;
      --card: #ffffff;
      --text: #201f1e;
      --border: #d2d0ce;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      width: 100%;
      max-width: 760px;
      margin-bottom: 8px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--azure);
      letter-spacing: -0.3px;
    }

    header p {
      color: var(--neutral);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .nav-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--azure);
      text-decoration: none;
      border: 1px solid var(--azure);
      border-radius: var(--radius);
      padding: 4px 12px;
    }
    .nav-link:hover { background: var(--azure-light); }

    .progress-wrap {
      width: 100%;
      max-width: 760px;
      margin-bottom: 20px;
      margin-top: 16px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--neutral);
      margin-bottom: 6px;
    }

    .progress-bar-track {
      background: var(--border);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--azure);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      width: 100%;
      max-width: 760px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .question-meta {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--azure);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .scenario-box {
      background: #f0f6fc;
      border-left: 4px solid var(--azure);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #1a1a1a;
    }

    .scenario-box .scene-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--azure-dark);
      margin-bottom: 6px;
    }

    .question-text {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: #faf9f8;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--azure);
      background: var(--azure-light);
    }

    .option-btn .letter {
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      margin-top: 1px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .option-btn:hover:not(:disabled) .letter {
      border-color: var(--azure);
      color: var(--azure);
    }

    .option-btn.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
    }

    .option-btn.correct .letter {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    .option-btn.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .option-btn.wrong .letter {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #fff;
    }

    .option-btn:disabled { cursor: default; }

    .explanation {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: #fffbe6;
      border-left: 4px solid #f9c53b;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
      display: none;
    }

    .explanation strong {
      display: block;
      margin-bottom: 4px;
      color: #7a5700;
    }

    .explanation.visible { display: block; }

    .actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 10px 22px;
      border-radius: var(--radius);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary { background: var(--azure); color: #fff; }
    .btn-primary:hover { background: var(--azure-dark); }

    .btn-secondary {
      background: transparent;
      color: var(--azure);
      border: 2px solid var(--azure);
    }
    .btn-secondary:hover { background: var(--azure-light); }

    .results {
      text-align: center;
      padding: 40px 32px;
    }

    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .score-ring.pass {
      background: var(--correct-bg);
      border: 5px solid var(--correct);
      color: var(--correct);
    }

    .score-ring.fail {
      background: var(--wrong-bg);
      border: 5px solid var(--wrong);
      color: var(--wrong);
    }

    .score-ring .pct { font-size: 2rem; line-height: 1; }
    .score-ring .label { font-size: 0.75rem; margin-top: 2px; }

    .results h2 { font-size: 1.4rem; margin-bottom: 8px; }

    .results .subtitle {
      color: var(--neutral);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-box {
      padding: 12px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      min-width: 100px;
    }

    .stat-box .num { font-size: 1.5rem; font-weight: 700; }
    .stat-box .desc { font-size: 0.78rem; color: var(--neutral); margin-top: 2px; }
    .stat-box.green .num { color: var(--correct); }
    .stat-box.red .num { color: var(--wrong); }

    .disclaimer {
      font-size: 0.75rem;
      color: var(--neutral);
      margin-top: 16px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 500px) {
      .card { padding: 20px 16px; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>AZ-900 情境題練習</h1>
  <p>Microsoft Azure Fundamentals &mdash; 25 道情境式選擇題</p>
  <a class="nav-link" href="index.html">← 回到標準練習題</a>
</header>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-label">
    <span id="progressText">題目 1 / 25</span>
    <span id="scoreText">得分：0</span>
  </div>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="card" id="quizCard">
  <div class="question-meta" id="questionMeta">題目 1 &bull; 雲端概念</div>
  <div class="scenario-box" id="scenarioBox">
    <div class="scene-label">情境</div>
    <div id="scenarioText"></div>
  </div>
  <div class="question-text" id="questionText"></div>
  <div class="options" id="optionsContainer"></div>
  <div class="explanation" id="explanation"></div>
  <div class="actions">
    <button class="btn btn-secondary" id="skipBtn" onclick="skipQuestion()">略過</button>
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none">下一題 →</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    topic: "雲端概念",
    scene: "Contoso 是一家中小型製造業公司，目前所有 IT 系統都自行建置於公司機房。IT 部門每季都要花大量時間採購伺服器、安裝硬體，並在業務量突增時苦於沒有足夠的計算資源。",
    q: "哪一項雲端特性最能解決 Contoso 在業務量突增時資源不足的問題？",
    opts: ["高可用性（High Availability）", "彈性（Elasticity）", "地理冗餘（Geo-redundancy）", "服務層級協議（SLA）"],
    a: 1,
    exp: "彈性（Elasticity）是指根據需求自動擴大或縮小計算資源的能力。當業務量突增時，雲端可自動增加資源；需求下降後再縮回，只需為實際使用量付費，完全解決了傳統機房資源不足的困境。"
  },
  {
    topic: "雲端概念",
    scene: "Fabrikam 正在評估是否將資料中心遷移至 Azure。財務長希望了解，遷移後 IT 支出的性質會有什麼改變，以及這對公司財務報表有何影響。",
    q: "將基礎架構從自建機房遷移至 Azure 後，IT 支出模式會如何轉變？",
    opts: ["從營運支出（OpEx）轉為資本支出（CapEx）", "從資本支出（CapEx）轉為營運支出（OpEx）", "CapEx 與 OpEx 同時增加", "IT 支出性質不變，只是總金額降低"],
    a: 1,
    exp: "傳統自建機房需要大量前期資本支出（CapEx）購買硬體設備。遷移至 Azure 後，改為依使用量付費的訂閱模式，屬於營運支出（OpEx）。OpEx 可立即於當期費用認列，改善現金流，且不需折舊攤提。"
  },
  {
    topic: "雲端概念",
    scene: "Adventure Works 是一家全球性零售商。他們希望同時利用現有機房投資（尤其是已折舊完畢的設備），又能在需求高峰（如雙十一購物季）時使用公有雲的彈性資源。",
    q: "哪種雲端部署模型最符合 Adventure Works 的需求？",
    opts: ["公有雲", "私有雲", "混合雲", "社群雲"],
    a: 2,
    exp: "混合雲（Hybrid Cloud）結合了地端私有雲與公有雲，讓組織能同時保留現有的機房投資，並在需要時彈性使用公有雲資源。Adventure Works 可將日常工作負載留在地端，尖峰時段再「爆發」至 Azure，最大化資源利用效率。"
  },
  {
    topic: "Azure 架構",
    scene: "Tailwind Traders 正在 Azure 上部署一個電商網站。架構師要求這個網站即使在單一資料中心發生全面故障（例如電力中斷或冷卻系統失效）時，仍必須保持正常運作。",
    q: "應使用哪個 Azure 功能將虛擬機器部署至不同的實體隔離設施，以抵禦單一資料中心故障？",
    opts: ["Azure 區域配對（Region Pairs）", "可用性區域（Availability Zones）", "可用性集合（Availability Sets）", "Azure Front Door"],
    a: 1,
    exp: "可用性區域（Availability Zones）是 Azure 區域內實體分隔的資料中心，各自擁有獨立的電力、冷卻和網路。將 VM 分散部署至不同的 AZ，即可在單一資料中心完全故障時維持服務，可達 99.99% 的 SLA。"
  },
  {
    topic: "Azure 架構",
    scene: "一家跨國企業擁有 8 個 Azure 訂閱，分別給不同的事業單位使用。IT 治理部門希望在所有訂閱上統一套用「所有資源必須加上 CostCenter 標籤」的規則，而不需要逐一到每個訂閱設定。",
    q: "哪個 Azure 功能可在多個訂閱之上提供統一的治理範圍，讓政策和存取控制向下套用至所有子訂閱？",
    opts: ["資源群組（Resource Groups）", "管理群組（Management Groups）", "Azure 藍圖（Azure Blueprints）", "Azure 原則（Azure Policy）"],
    a: 1,
    exp: "管理群組（Management Groups）是訂閱之上的治理範圍。您可以將多個訂閱組織在管理群組下，在管理群組層級指派 Azure 原則和 RBAC，這些設定會自動繼承到其下所有的訂閱和資源群組，大幅降低跨訂閱治理的管理負擔。"
  },
  {
    topic: "Azure 計算",
    scene: "Litware 是一家新創公司，開發了一個 Python Web API。他們希望快速上線，不想花時間管理虛擬機器的作業系統更新、修補程式或擴展設定；只想專注在程式碼本身。",
    q: "哪個 Azure 服務最適合 Litware 部署他們的 Python Web API，且無需管理基礎 VM？",
    opts: ["Azure 虛擬機器（Azure Virtual Machines）", "Azure Kubernetes Service (AKS)", "Azure App Service", "Azure Batch"],
    a: 2,
    exp: "Azure App Service 是 PaaS 服務，支援 Python、Node.js、.NET 等多種語言。Microsoft 負責管理底層 VM、OS 修補與自動縮放，開發人員只需部署程式碼。對於希望快速上線且不想管理基礎架構的新創公司而言是最佳選擇。"
  },
  {
    topic: "Azure 計算",
    scene: "每天午夜，Northwind 的系統需要掃描資料庫中所有訂單，產生日報表，通常只需執行 3 到 5 分鐘。這個任務在其他時間完全不需要任何計算資源。",
    q: "哪個 Azure 服務最適合執行這種短時間、事件觸發的自動化任務，且只在執行期間產生費用？",
    opts: ["Azure 虛擬機器（7×24 運行）", "Azure App Service（基本方案）", "Azure Functions（消費方案）", "Azure Container Instances（持續運行）"],
    a: 2,
    exp: "Azure Functions 消費方案（Consumption Plan）是無伺服器（Serverless）計算，程式碼只在觸發時執行，執行完畢後資源立即釋放。計費以「執行次數 × 執行時間 × 記憶體用量」計算，對於每天只跑幾分鐘的排程任務，成本極低。"
  },
  {
    topic: "Azure 計算",
    scene: "Best For You Organics 需要批次處理數十萬張影像的縮圖轉換工作。這些工作高度平行、計算密集，且任務之間相互獨立。他們希望能使用數百台 VM 同時處理，完成後自動釋放資源。",
    q: "哪個 Azure 服務專門設計用於大規模平行批次計算工作負載？",
    opts: ["Azure App Service", "Azure Functions", "Azure Batch", "Azure Container Instances"],
    a: 2,
    exp: "Azure Batch 可以排程並管理大規模的平行計算工作。您定義工作和任務，Batch 自動佈建數百到數千台 VM 並行處理，完成後自動清除資源。非常適合影像轉換、財務模擬、基因組分析等高平行化批次工作。"
  },
  {
    topic: "Azure 儲存",
    scene: "Wide World Importers 正在建立一個媒體平台，需要儲存數 TB 的使用者上傳影片、圖片和 PDF 文件。這些是非結構化資料，需要透過 HTTP/HTTPS 提供給全球使用者存取。",
    q: "哪個 Azure 儲存服務最適合儲存大量非結構化的媒體檔案？",
    opts: ["Azure SQL Database", "Azure Queue Storage", "Azure Blob Storage", "Azure File Storage"],
    a: 2,
    exp: "Azure Blob Storage 是專為非結構化資料（影片、圖片、文件、備份）設計的物件儲存服務，可儲存任意大小的資料，支援 HTTP/HTTPS 直接存取，有「熱」、「冷」、「封存」等存取層級可依成本需求選擇，非常適合媒體平台使用。"
  },
  {
    topic: "Azure 儲存",
    scene: "一家金融機構將交易記錄儲存在 Azure Blob Storage。他們的合規部門要求：即使某個 Azure 資料中心發生完全故障，資料仍必須可以被讀取。但他們也擔心整個 Azure 區域（例如東亞）發生災難性事件。",
    q: "哪種儲存冗餘選項最能滿足這家金融機構「跨資料中心 + 跨區域」的資料保護需求？",
    opts: ["本地備援儲存 (LRS)", "區域備援儲存 (ZRS)", "異地備援儲存 (GRS)", "讀取存取異地備援儲存 (RA-GRS)"],
    a: 3,
    exp: "RA-GRS 在主要區域的 3 個 AZ 間複製資料（保護資料中心故障），同時非同步複製到次要區域（保護整個區域災難）。相比 GRS，RA-GRS 還允許從次要區域唯讀存取，在主要區域故障時仍可讀取資料，最符合這家金融機構的需求。"
  },
  {
    topic: "Azure 網路",
    scene: "Adatum Corporation 在台北有自己的資料中心，他們計劃遷移部分工作負載至 Azure，但有些敏感的財務系統必須留在地端。他們需要確保地端系統與 Azure 上的系統之間能安全互通，且連線不透過公共網際網路，要求低延遲和穩定頻寬。",
    q: "哪個 Azure 服務提供私有的專線連線，不透過公共網際網路連接地端和 Azure？",
    opts: ["Azure VPN Gateway (Site-to-Site VPN)", "Azure Application Gateway", "Azure ExpressRoute", "Azure Traffic Manager"],
    a: 2,
    exp: "Azure ExpressRoute 透過電信業者提供的私有連線，將地端網路連至 Azure，完全不經過公共網際網路。相比 VPN Gateway，ExpressRoute 提供更低的延遲、更高的頻寬可靠性，以及更強的安全性，適合需要穩定高速專線的金融和企業客戶。"
  },
  {
    topic: "Azure 網路",
    scene: "Contoso 將電商網站部署在 Azure 的 3 台虛擬機器上。他們希望當使用者流量進來時，能均勻分配到這 3 台 VM，並在某台 VM 故障時自動將流量導向其他健康的 VM。",
    q: "哪個 Azure 服務在網路層（Layer 4）將傳入流量分散至多個後端 VM？",
    opts: ["Azure Traffic Manager", "Azure Load Balancer", "Azure Application Gateway", "Azure Front Door"],
    a: 1,
    exp: "Azure Load Balancer 在 Layer 4（TCP/UDP）運作，透過健康狀態探測自動偵測後端 VM 的狀態，並將傳入流量均勻分散至健康的 VM。它是 Azure 內部負載平衡的基礎服務，支援 VM 和 VM 擴展集（VMSS）。"
  },
  {
    topic: "Azure 資料庫",
    scene: "Relecloud 正在開發一個社交遊戲平台，需要儲存玩家資料、遊戲狀態和排行榜。他們的用戶遍布全球各地，要求無論玩家在哪個洲，讀寫延遲都必須在 10 毫秒以內，且資料庫本身必須能在全球多個區域提供服務。",
    q: "哪個 Azure 資料庫服務最適合這個需要全球分散、低延遲的應用場景？",

let current = 0;
let score = 0;
let skipped = 0;
let answered = new Array(QUESTIONS.length).fill(null);
let shuffled = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  shuffled = shuffle(QUESTIONS.map((_, i) => i));
  current = 0;
  score = 0;
  skipped = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  document.getElementById('progressWrap').style.display = '';
  renderQuestion();
}

function renderQuestion() {
  const total = QUESTIONS.length;
  const qi = shuffled[current];
  const q = QUESTIONS[qi];

  document.getElementById('progressText').textContent = `題目 ${current + 1} / ${total}`;
  document.getElementById('scoreText').textContent = `得分：${score}`;
  document.getElementById('progressFill').style.width = `${(current / total) * 100}%`;
  document.getElementById('questionMeta').innerHTML = `題目 ${current + 1} &bull; ${q.topic}`;
  document.getElementById('scenarioText').textContent = q.scene;
  document.getElementById('questionText').textContent = q.q;

  const letters = ['A', 'B', 'C', 'D'];
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  document.getElementById('explanation').className = 'explanation';
  document.getElementById('explanation').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display = '';
}

function selectAnswer(idx) {
  const qi = shuffled[current];
  const q = QUESTIONS[qi];
  const buttons = document.querySelectorAll('.option-btn');

  buttons.forEach(btn => btn.disabled = true);

  const isCorrect = idx === q.a;
  if (isCorrect) score++;
  answered[current] = idx;

  buttons[idx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) buttons[q.a].classList.add('correct');

  const exp = document.getElementById('explanation');
  exp.innerHTML = `<strong>${isCorrect ? '✓ 答對了！' : '✗ 答錯了'}</strong>${q.exp}`;
  exp.className = 'explanation visible';

  document.getElementById('nextBtn').style.display = '';
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('scoreText').textContent = `得分：${score}`;
}

function skipQuestion() {
  skipped++;
  answered[current] = -1;
  nextQuestion();
}

function nextQuestion() {
  current++;
  if (current >= QUESTIONS.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  const total = QUESTIONS.length;
  const pct = Math.round((score / total) * 100);
  const pass = pct >= 70;

  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '全部完成';
  document.getElementById('scoreText').textContent = `得分：${score}`;

  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div class="results">
      <div class="score-ring ${pass ? 'pass' : 'fail'}">
        <span class="pct">${pct}%</span>
        <span class="label">${pass ? '通過' : '未通過'}</span>
      </div>
      <h2>${pass ? '太棒了！' : '繼續加油！'}</h2>
      <p class="subtitle">${pass ? '您對 Azure 情境題有很好的掌握！' : '建議複習 Azure Fundamentals 學習路徑後再試一次。'}</p>
      <div class="stats">
        <div class="stat-box green">
          <div class="num">${score}</div>
          <div class="desc">答對</div>
        </div>
        <div class="stat-box red">
          <div class="num">${total - score - skipped}</div>
          <div class="desc">答錯</div>
        </div>
        <div class="stat-box">
          <div class="num">${skipped}</div>
          <div class="desc">略過</div>
        </div>
        <div class="stat-box">
          <div class="num">${total}</div>
          <div class="desc">總題數</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="startQuiz()">再練一次</button>
        <a class="btn btn-secondary" href="index.html" style="text-decoration:none;">回標準題型</a>
      </div>
      <p class="disclaimer">AZ-900 及格分數約 700/1000（約 70%）。題目每次隨機排序。本題庫僅供練習參考。</p>
    </div>
  `;
}

startQuiz();
</script>
