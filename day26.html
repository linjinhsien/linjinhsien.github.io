<script>
const QUESTIONS = [
  {
    type: "單選題",
    topic: "Policy 應用場景",
    scene: "Titan 科技希望禁止 RG-Production 建立任何 VM，但允許團隊繼續在該 Resource Group 建立其他類型資源。",
    q: "應該採用哪一項 Azure 服務達成此目標？",
    opts: [
      "Resource Lock",
      "Azure RBAC Role",
      "Tag",
      "Azure Policy"
    ],
    a: 3,
    exp: "關鍵字「只禁止某一類資源建立，但其他資源仍可建立」是治理規則，不是整個 Resource Group 的刪除或修改鎖定。Azure Policy 可以透過資源類型條件與 Deny Effect 達成這類精細限制。Resource Lock 無法精準禁止「只建立 VM」而不影響其他資源；RBAC 是身分與權限模型，無法限制特定資源類型的建立；Tag 只是分類標籤，不具治理強制力。ExamTopics Q277 高票支持 D。"
  },
  {
    type: "單選題",
    topic: "Region 限制",
    scene: "Titan 科技有一個 Subscription，現有資源分布於數個核准 Region。公司要求管理員未來只能在這些核准 Region 建立 Azure 資源。",
    q: "應該使用哪項服務達成此治理目標？",
    opts: [
      "Read-only Resource Lock",
      "Azure Policy",
      "Management Group",
      "Reservation"
    ],
    a: 1,
    exp: "「建立資源時的治理規則」→ Azure Policy。可建立 Allowed Locations Policy Definition，再套用 Deny Effect，阻止在未核准 Region 建立任何資源。Management Group 是治理 Scope 的容器，不是規則本身；Reservation 是成本/容量承諾方案；Resource Lock (ReadOnly) 是防止修改或刪除現有資源，不能限制新資源的建立位置。ExamTopics Q145 社群回報與 Microsoft Learn Policy 文件一致。"
  },
  {
    type: "單選題",
    topic: "Resource Lock 繼承行為",
    scene: "Titan 科技將 RG-Payments 設定為 CanNotDelete 鎖定。",
    q: "下列敘述何者最符合 Azure Resource Lock 的行為？",
    opts: [
      "Resource Group 的鎖只保護當時已存在的資源，之後新加入的資源不受影響",
      "Resource Group 的鎖可由其中的資源繼承，之後新增的資源也會受到父層鎖定影響",
      "Resource Lock 只能套用到單一 Resource，不能套用到 Resource Group 層級",
      "具有 Owner RBAC 角色就一定可以忽略 Resource Lock，直接進行刪除"
    ],
    a: 1,
    exp: "Resource Lock 的繼承特性：可套用在 Subscription、Resource Group 或 Resource；父層的鎖可以由子資源繼承，包括之後新增的資源。這正是把鎖放在 Resource Group 層級來保護整批生產資源的原因。選項 D 是重要陷阱：即使具有 Owner RBAC 角色，仍受 Lock 限制，必須先移除鎖定才能進行被鎖住的操作——RBAC 與 Lock 是兩個獨立的保護機制。ExamTopics Q303 高票討論支持 B。"
  },
  {
    type: "單選題",
    topic: "跨 Subscription 治理",
    scene: "Titan 科技希望跨多個 Subscription 統一套用「只允許在核准 Region 建立資源」的規則。",
    q: "下列哪項方案最適合達成此跨訂用帳戶治理目標？",
    opts: [
      "為每個 Resource Group 建立不同名稱以識別核准區域",
      "建立 Resource Lock 鎖定各 Resource Group",
      "使用 Azure Policy，並在適當的治理 Scope（如 Management Group）指派",
      "使用 Reservation 預訂特定 Region 的容量"
    ],
    a: 2,
    exp: "跨多個 Subscription 的規則治理應使用 Azure Policy，並在 Management Group 等上層 Scope 進行 Policy Assignment，讓規則自動往下套用到所有 Subscription 與 Resource Group。Resource Group 名稱只是識別容器，不是跨 Subscription 的治理規則引擎；Resource Lock 是防刪/防修改，不是建立規則；Reservation 是成本承諾，完全不適用。Microsoft Learn Policy 官方文件驗證。"
  },
  {
    type: "單選題",
    topic: "Policy vs Lock 分工",
    scene: "Titan 科技要同時完成兩件事：(1) 禁止管理員在未核准 Region 建立 VM；(2) 防止生產 Resource Group 被意外刪除。",
    q: "下列哪個配對方案最合理？",
    opts: [
      "兩者都使用 Resource Lock",
      "兩者都使用 Azure Policy",
      "Region 限制使用 Azure Policy；生產 Resource Group 使用 Resource Lock",
      "Region 限制使用 Microsoft Purview；生產 Resource Group 使用 Tag"
    ],
    a: 2,
    exp: "AZ-900 最核心的治理服務分工題型：第一個需求是「規則合規」→ Azure Policy（限制 Region、Deny Effect）；第二個需求是「防止意外刪除」→ Resource Lock（CanNotDelete）。全選 Lock 無法強制 Region 規則；全選 Policy 無法作為防刪保護；Purview 是資料治理工具，Tag 是分類標籤，兩者都不能達成這兩個目標。記住口訣：「組織規則→Policy；防呆保護→Lock；資料治理→Purview」。"
  },
  {
    type: "情境決策題",
    topic: "治理架構選型",
    scene: "Titan 科技擁有 12 個 Azure Subscriptions。稽核發現：有些 VM 被部署到未核准 Region；部分資源缺少 CostCenter 與 Environment Tag；開發人員誤刪了一個 Resource Group；資料治理團隊需要建立全企業資料資產清單。",
    q: "CTO 要求以正確分工的現代化方案解決以上問題，哪個架構方案最合理？",
    opts: [
      "在每台 VM 上建立 Resource Lock，要求工程師自行檢查 Region 與 Tags；資料資產以 Resource Group 名稱管理",
      "在 Management Group/Subscription Scope 指派 Azure Policy 治理 Region 與 Tags；對生產資源使用 Resource Lock；資料資產治理導入 Microsoft Purview；舊 Blueprints 規劃遷移至 Deployment Stacks / Template Specs",
      "使用 Microsoft Purview 阻止 VM 建立在錯誤 Region，並使用 Azure Policy 取代所有 Resource Locks",
      "使用 Azure RBAC 限制所有 VM 只能建立在特定 Region，以 Tags 取代 Resource Locks"
    ],
    a: 1,
    exp: "選項 B 是標準現代 Azure 治理架構：Policy 解決規則問題（Region、Tags、組態標準）；Lock 解決資源防呆問題（防止誤刪生產資源）；Purview 解決資料治理問題（資料資產探索與中繼資料）；Blueprints 正在退役，現行遷移方向是 Deployment Stacks + Template Specs。選項 A 把 Policy 責任推回人工流程，必然產生組態漂移。選項 C 誤用 Purview（它不是 ARM 資源建立的治理工具）。選項 D 誤用 RBAC（它控制誰有權限，不是資源組態規則）。"
  },
  {
    type: "單選題",
    topic: "CanNotDelete vs ReadOnly",
    scene: null,
    q: "Azure Resource Lock 的 CanNotDelete 與 ReadOnly 兩種層級的最主要差異是什麼？",
    opts: [
      "CanNotDelete 允許讀取與修改但不允許刪除；ReadOnly 允許讀取但不允許修改與刪除",
      "CanNotDelete 不允許任何操作；ReadOnly 只允許讀取",
      "CanNotDelete 和 ReadOnly 效果相同，只差在鎖定的名稱",
      "CanNotDelete 只能套用到 Resource；ReadOnly 只能套用到 Resource Group"
    ],
    a: 0,
    exp: "兩種 Lock 的核心差異：CanNotDelete（允許讀取 ✅、允許修改 ✅、不允許刪除 ❌）；ReadOnly（允許讀取 ✅、不允許修改 ❌、不允許刪除 ❌）。ReadOnly 的限制更嚴格，連修改都不允許。生產資料庫通常使用 CanNotDelete 防誤刪，但仍允許正常讀寫；若要凍結特定設定不被修改則使用 ReadOnly。兩種鎖定都可以套用到 Subscription、Resource Group 或 Resource 層級。"
  },
  {
    type: "單選題",
    topic: "Azure Blueprints 現況",
    scene: null,
    q: "關於 Azure Blueprints 的現況（截至 2026 年），哪個描述最正確？",
    opts: [
      "Azure Blueprints 是微軟目前最推薦的新治理與部署封裝服務",
      "Azure Blueprints 正在分階段退休，2026 年 7 月 31 日起無法建立新的 Blueprint 定義與版本，2027 年 1 月 31 日正式退休",
      "Azure Blueprints 是 Enterprise Agreement 的獨家功能，一般訂用帳戶無法使用",
      "Azure Blueprints 已正式更名為 Azure Deployment Stacks，功能完全相同"
    ],
    a: 1,
    exp: "Azure Blueprints 退休時程：2026/07/31 起不能建立新的 Blueprint 定義與版本；2026/10/31 既有定義不能修改，也不能建立新 Assignment；2026/12/31 既有 Assignment 不能修改；2027/01/31 正式退休。若舊題庫出現 Blueprints 作為現行答案，需要辨識這是歷史答案。Azure Deployment Stacks 是獨立的新服務（不是更名），與 Template Specs 搭配使用是微軟建議的遷移方向。"
  },
  {
    type: "單選題",
    topic: "Blueprints 遷移方向",
    scene: null,
    q: "微軟建議用哪個組合取代即將退休的 Azure Blueprints？",
    opts: [
      "Azure Policy + Resource Locks",
      "Azure DevOps + ARM Templates",
      "Azure Deployment Stacks + Template Specs",
      "Azure Resource Manager + Management Groups"
    ],
    a: 2,
    exp: "Microsoft 官方建議：將既有 Azure Blueprints 內容遷移至 Azure Deployment Stacks（用於將一組 Azure 資源作為單位進行部署、生命週期管理與保護）搭配 Template Specs（用於儲存與共用 ARM / Bicep 範本）。Azure Policy + Resource Locks 各有其職責（合規治理與防刪保護），不是 Blueprints 的直接替代；Azure DevOps 是 CI/CD 平台；Management Groups 是治理範圍容器。"
  },
  {
    type: "單選題",
    topic: "Microsoft Purview 定位",
    scene: null,
    q: "下列關於 Microsoft Purview 的描述，哪個最正確？",
    opts: [
      "Microsoft Purview 用於強制執行跨 Subscription 的資源建立規則，例如限制 VM 只能在特定 Region",
      "Microsoft Purview 用於防止生產資料庫被意外刪除，相當於 Resource Lock 的替代方案",
      "Microsoft Purview 提供資料資產探索、敏感度分類、中繼資料管理與資料治理能力",
      "Microsoft Purview 是 Azure 的 SIEM 平台，用於分析跨多雲的資安日誌"
    ],
    a: 2,
    exp: "Microsoft Purview 現代資料治理體驗包含 Data Map（技術層的資料資產與中繼資料地圖）與 Unified Catalog（商務與治理使用者的資料探索與治理）。它聚焦在「資料內容本體與中繼資料」，不管 ARM 基礎設施資源（VM/NIC）的建立或刪除防護。考場秒殺口訣：問「探索資料資產、資料目錄、中繼資料、敏感個資掃描」→ Purview；問「限制 Region / 強制 Tag」→ Policy；問「防止刪除」→ Lock；問「SIEM/SOAR」→ Sentinel。"
  },
  {
    type: "單選題",
    topic: "Policy Initiative",
    scene: null,
    q: "Azure Policy 中的 Initiative（方案）是什麼？",
    opts: [
      "帶有多個條件判斷的單一複雜 Policy Definition",
      "將多個相關的 Policy Definitions 集合成一組治理方案，方便統一管理與指派",
      "全域自動套用到所有 Subscription 的特殊政策",
      "套用到 Policy Assignment 上的 Resource Lock 類型"
    ],
    a: 1,
    exp: "Initiative（方案）是將多個相關 Policy Definitions 集合成一組治理方案，例如「ISO 27001 合規方案」可能包含數十條各別的 Policy Definition。使用 Initiative 的好處是只需一次 Assignment 就能套用整套規則，並在合規儀表板中統一追蹤合規狀態。舉例：Microsoft 內建的「啟用 Azure 資訊安全中心監控」Initiative 就是由多條 Policy Definition 組成的方案。"
  },
  {
    type: "單選題",
    topic: "Audit vs Deny Effect",
    scene: null,
    q: "Azure Policy 中 Audit 與 Deny 兩種 Effect 的最主要差異是什麼？",
    opts: [
      "Audit 會阻擋不符合規則的資源建立請求；Deny 只記錄違規不會阻擋",
      "Audit 將不符合規則的資源標記為 Non-compliant 並記錄，但不阻擋資源建立；Deny 直接阻止 ARM 請求，不符合規則的資源無法建立",
      "Audit 和 Deny 效果完全相同，只差在違規通知的方式",
      "Audit 是免費功能；Deny 需要額外付費才能使用"
    ],
    a: 1,
    exp: "Audit vs Deny 是 AZ-900 考場最重要的分水嶺：Audit（稽核）—不符合規則 → 記錄為 Non-compliant，但資源仍可建立，適合「先盤點後治理」的導入階段；Deny（拒絕）—不符合規則 → 阻止 ARM 請求，資源根本無法建立，適合規範已成熟、不能允許例外的安全邊界。其他 Effect 還包括 Modify（自動修正屬性，如補 Tag）與 DeployIfNotExists（若缺少相依資源則自動部署）。"
  }
];

let current=0,score=0,skipped=0,answered,shuffled;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){shuffled=shuffle(QUESTIONS.map((_,i)=>i));current=0;score=0;skipped=0;answered=new Array(QUESTIONS.length).fill(null);renderQuestion();}
function renderQuestion(){
  const total=QUESTIONS.length,q=QUESTIONS[shuffled[current]];
  document.getElementById("progressText").textContent="題目 "+(current+1)+" / "+total;
  document.getElementById("scoreText").textContent="得分："+score;
  document.getElementById("progressFill").style.width=((current/total)*100)+"%";
  document.getElementById("questionMeta").innerHTML="題目 "+(current+1)+" &bull; "+q.topic;
  document.getElementById("qtypeBadge").textContent=q.type;
  const sb=document.getElementById("scenarioBox");
  if(q.scene){sb.style.display="";document.getElementById("scenarioText").textContent=q.scene;}else{sb.style.display="none";}
  document.getElementById("questionText").textContent=q.q;
  const letters=["A","B","C","D"],container=document.getElementById("optionsContainer");
  container.innerHTML="";
  q.opts.forEach((opt,i)=>{const btn=document.createElement("button");btn.className="option-btn";btn.innerHTML="<span class=\"letter\">"+letters[i]+"</span><span>"+opt+"</span>";btn.onclick=()=>selectAnswer(i);container.appendChild(btn);});
  document.getElementById("explanation").className="explanation";document.getElementById("explanation").innerHTML="";
  document.getElementById("nextBtn").style.display="none";document.getElementById("skipBtn").style.display="";
}
function selectAnswer(idx){
  const q=QUESTIONS[shuffled[current]],buttons=document.querySelectorAll(".option-btn");
  buttons.forEach(b=>b.disabled=true);const ok=idx===q.a;if(ok)score++;answered[current]=idx;
  buttons[idx].classList.add(ok?"correct":"wrong");if(!ok)buttons[q.a].classList.add("correct");
  const exp=document.getElementById("explanation");exp.innerHTML="<strong>"+(ok?"✓ 答對了！":"✗ 答錯了")+"</strong>"+q.exp;exp.className="explanation visible";
  document.getElementById("nextBtn").style.display="";document.getElementById("skipBtn").style.display="none";
  document.getElementById("scoreText").textContent="得分："+score;
}
function skipQuestion(){skipped++;answered[current]=-1;nextQuestion();}
function nextQuestion(){current++;if(current>=QUESTIONS.length)showResults();else renderQuestion();}
function showResults(){
  const total=QUESTIONS.length,pct=Math.round((score/total)*100),pass=pct>=70;
  document.getElementById("progressFill").style.width="100%";
  document.getElementById("progressText").textContent="全部完成";
  document.getElementById("scoreText").textContent="得分："+score;
  const nextDayHtml="day27.html";
  document.getElementById("quizCard").innerHTML="<div class=\"results\"><div class=\"score-ring "+(pass?"pass":"fail")+"\"><span class=\"pct\">"+pct+"%</span><span class=\"label\">"+(pass?"通過":"未通過")+"</span></div><h2>"+(pass?"太棒了！完成！":"繼續加油！")+"</h2><p class=\"subtitle\">"+(pass?"掌握很好！":"建議複習後再試。")+"</p><div class=\"stats\"><div class=\"stat-box green\"><div class=\"num\">"+score+"</div><div class=\"desc\">答對</div></div><div class=\"stat-box red\"><div class=\"num\">"+(total-score-skipped)+"</div><div class=\"desc\">答錯</div></div><div class=\"stat-box\"><div class=\"num\">"+skipped+"</div><div class=\"desc\">略過</div></div><div class=\"stat-box\"><div class=\"num\">"+total+"</div><div class=\"desc\">總題數</div></div></div><div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap;\"><button class=\"btn btn-primary\" onclick=\"startQuiz()\">再練一次</button><a class=\"btn btn-secondary\" href=\""+nextDayHtml+"\" style=\"text-decoration:none;\">下一天 →</a></div><p class=\"disclaimer\">AZ-900 及格約 70%。題目每次隨機排序。本題庫僅供練習參考。</p></div>";
}
startQuiz();
</script>
</body>
</html>
