<style>
:root{--azure:#0078d4;--azure-dark:#005a9e;--azure-light:#d0e8f8;--correct:#107c10;--correct-bg:#dff6dd;--wrong:#c50f1f;--wrong-bg:#fde7e9;--neutral:#605e5c;--bg:#f3f2f1;--card:#fff;--text:#201f1e;--border:#d2d0ce;--radius:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
header{width:100%;max-width:800px;margin-bottom:8px;text-align:center;}

.day-badge{display:inline-block;background:var(--azure);color:#fff;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:6px;}
header p{color:var(--neutral);margin-top:4px;font-size:.9rem;}
.nav-links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.nav-link{display:inline-block;font-size:.82rem;color:var(--azure);text-decoration:none;border:1px solid var(--azure);border-radius:var(--radius);padding:4px 12px;}
.nav-link:hover{background:var(--azure-light);}
.progress-wrap{width:100%;max-width:800px;margin:16px 0 20px;}
.progress-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--neutral);margin-bottom:6px;}
.progress-bar-track{background:var(--border);border-radius:99px;height:8px;overflow:hidden;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;width:100%;max-width:800px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.question-meta{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--azure);font-weight:600;margin-bottom:10px;}
.qtype-badge{display:inline-block;background:#e6f0fa;color:var(--azure-dark);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:8px;}
.scenario-box{background:#f0f6fc;border-left:4px solid var(--azure);border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;margin-bottom:16px;font-size:.93rem;line-height:1.65;}
.scenario-box .scene-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--azure-dark);margin-bottom:6px;}
.question-text{font-size:1.03rem;line-height:1.6;margin-bottom:18px;font-weight:600;}
.options{display:flex;flex-direction:column;gap:10px;}
.option-btn{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:2px solid var(--border);border-radius:var(--radius);background:#faf9f8;cursor:pointer;font-size:.93rem;line-height:1.5;text-align:left;transition:border-color .15s,background .15s;width:100%;}
.option-btn:hover:not(:disabled){border-color:var(--azure);background:var(--azure-light);}
.option-btn .letter{min-width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;margin-top:1px;transition:background .15s,border-color .15s,color .15s;}
.option-btn:hover:not(:disabled) .letter{border-color:var(--azure);color:var(--azure);}
.option-btn.correct{border-color:var(--correct);background:var(--correct-bg);}
.option-btn.correct .letter{background:var(--correct);border-color:var(--correct);color:#fff;}
.option-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
.option-btn.wrong .letter{background:var(--wrong);border-color:var(--wrong);color:#fff;}
.option-btn:disabled{cursor:default;}
.explanation{margin-top:18px;padding:14px 16px;border-radius:var(--radius);background:#fffbe6;border-left:4px solid #f9c53b;font-size:.88rem;line-height:1.6;display:none;}
.explanation strong{display:block;margin-bottom:4px;color:#7a5700;}
.explanation.visible{display:block;}
.actions{margin-top:22px;display:flex;justify-content:flex-end;gap:12px;}
.btn{padding:10px 22px;border-radius:var(--radius);font-size:.92rem;font-weight:600;cursor:pointer;border:none;transition:background .15s,transform .1s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--azure);color:#fff;}
.btn-primary:hover{background:var(--azure-dark);}
.btn-secondary{background:transparent;color:var(--azure);border:2px solid var(--azure);}
.btn-secondary:hover{background:var(--azure-light);}
.results{text-align:center;padding:40px 32px;}
.score-ring{width:130px;height:130px;border-radius:50%;margin:0 auto 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;}
.score-ring.pass{background:var(--correct-bg);border:5px solid var(--correct);color:var(--correct);}
.score-ring.fail{background:var(--wrong-bg);border:5px solid var(--wrong);color:var(--wrong);}
.score-ring .pct{font-size:2rem;line-height:1;}
.score-ring .label{font-size:.75rem;margin-top:2px;}
.results h2{font-size:1.4rem;margin-bottom:8px;}
.results .subtitle{color:var(--neutral);font-size:.9rem;margin-bottom:24px;}
.stats{display:flex;gap:16px;justify-content:center;margin-bottom:28px;flex-wrap:wrap;}
.stat-box{padding:12px 20px;border-radius:var(--radius);border:1px solid var(--border);min-width:100px;}
.stat-box .num{font-size:1.5rem;font-weight:700;}
.stat-box .desc{font-size:.78rem;color:var(--neutral);margin-top:2px;}
.stat-box.green .num{color:var(--correct);}
.stat-box.red .num{color:var(--wrong);}
.disclaimer{font-size:.75rem;color:var(--neutral);margin-top:16px;max-width:500px;margin-left:auto;margin-right:auto;}
@media(max-width:500px){.card{padding:20px 16px;}header h1{font-size:1.4rem;}}
</style>

<script>
const QUESTIONS=[
  {type:"單選題",topic:"Azure Policy 資源類型限制",scene:"",q:"Titan 科技希望禁止 RG-Production 建立任何 VM，但允許團隊繼續在該 Resource Group 建立其他類型資源（如 Storage Account、Key Vault 等），應採用哪一項？",opts:["Resource Lock","Azure RBAC 角色","Tag","Azure Policy"],a:3,exp:"Azure Policy 可透過資源類型條件搭配 Deny Effect，精準禁止特定資源類型的建立。Resource Lock 是整體防刪除/修改保護，無法只針對某種資源類型；RBAC 控制的是身分與操作權限，不是資源屬性規則；Tag 只是分類資訊，無治理效果。"},
  {type:"單選題",topic:"Azure Policy 地理位置限制",scene:"",q:"Titan 科技的 Subscription 分布於數個核准 Region，公司要求管理員未來只能在這些核准 Region 建立 Azure 資源，應使用哪項服務？",opts:["Read-only Resource Lock","Azure Policy","Management Group","Reservation"],a:1,exp:"Azure Policy 可建立 Location 政策並指派到 Subscription 或 Management Group，強制所有新資源只能建立在核准 Region。Management Group 是治理 Scope 的容器本身，不是規則；Resource Lock 防止刪除/修改；Reservation 是成本容量承諾方案，三者均不能限制 Region。"},
  {type:"單選題",topic:"Resource Lock 繼承行為",scene:"",q:"Titan 科技將 RG-Payments 設定為 CanNotDelete 鎖定，下列何者最符合 Azure Resource Lock 的行為？",opts:["Resource Group 的鎖只保護當時已存在的資源，新加入的資源不受影響","Resource Group 的鎖可由其中的資源繼承，之後新增的資源也會受到父層鎖定影響","Resource Lock 只能套用到單一 Resource，不能套用到 Resource Group","具有 Owner RBAC 角色就一定可以忽略 Resource Lock"],a:1,exp:"Resource Lock 可套用在 Subscription、Resource Group 或 Resource；父層的鎖可由子資源繼承，包含之後新增的資源。即使具備 Owner RBAC 角色，也必須先移除鎖定才能執行被鎖住的操作，RBAC 不能覆蓋 Lock。"},
  {type:"單選題",topic:"Azure Policy 跨訂閱治理",scene:"",q:"Titan 科技希望跨多個 Subscription 統一套用「只允許在核准 Region 建立資源」的規則，下列哪項最適合？",opts:["為每個 Resource Group 建立不同的命名慣例","對每個 Subscription 的所有資源建立 Resource Lock","使用 Azure Policy，並在 Management Group 等適當的治理 Scope 指派","使用 Azure Reservation 進行容量承諾"],a:2,exp:"Azure Policy 可在 Management Group 層級指派，讓旗下所有 Subscription 自動套用同一條治理規則，是跨訂閱大規模治理的標準做法。Resource Group 命名和 Reservation 都不是治理規則；Resource Lock 是防刪除/修改機制，無法限制建立 Region。"},
  {type:"服務配對題",topic:"Azure Policy vs Resource Lock 分工",scene:"",q:"Titan 科技需要同時完成：① 禁止管理員把 VM 建立在未核准 Region；② 防止生產 Resource Group 被意外刪除。下列哪個配對最合理？",opts:["兩者都使用 Resource Lock","兩者都使用 Azure Policy","① 使用 Azure Policy；② 使用 Resource Lock","① 使用 Microsoft Purview；② 使用 Tag"],a:2,exp:"① 限制 Region 是治理規則合規需求，應使用 Azure Policy（Deny Effect）。② 防止意外刪除是資源防呆需求，應使用 Resource Lock（CanNotDelete）。兩者職責不同：Policy 管規則，Lock 管資源保護，不可互換。"},
  {type:"單選題",topic:"Policy Definition 與 Assignment",scene:"",q:"Azure Policy 中，「Policy Definition」與「Policy Assignment」的關係，下列敘述何者正確？",opts:["Definition 已包含指派範圍，建立後自動套用到整個租用戶","Assignment 才是正式把 Policy Definition 套用到特定 Scope（如 Subscription 或 Resource Group）","Definition 與 Assignment 可以互換使用，功能完全相同","一個 Policy Definition 只能建立一個 Assignment"],a:1,exp:"Policy Definition 是規則本身（法條），描述什麼條件算違規及要採取什麼 Effect；Policy Assignment 才是正式把規則套用到特定 Scope（Management Group、Subscription、Resource Group）。Definition 不等於已套用到環境，必須透過 Assignment 才會生效；一個 Definition 可以建立多個 Assignment 套用到不同 Scope。"},
  {type:"單選題",topic:"Policy Effect - Audit vs Deny",scene:"",q:"Titan 科技正處於治理導入初期，想先盤點現有哪些資源不合規（尚未準備好全面阻擋新建立的資源），應選擇哪種 Azure Policy Effect？",opts:["Deny，立即阻止所有不符合規則的資源建立或更新請求","Audit，記錄不合規資源為 Non-compliant 但不阻止其建立或修改","Modify，自動修正資源的標籤或設定","DeployIfNotExists，在資源建立時自動部署相關組態"],a:1,exp:"Audit Effect 會評估資源是否符合規則，並將不合規的資源標記為 Non-compliant，但不會阻止請求，適合「先盤點、後治理」的導入階段。Deny 適合規範成熟後直接阻擋違規；Modify 用於修正 Tags 等設定；DeployIfNotExists 用於自動部署相關組態，三者都會干預資源操作。"},
  {type:"單選題",topic:"Resource Lock 鎖定類型比較",scene:"",q:"Azure Resource Lock 的 ReadOnly 鎖定與 CanNotDelete 鎖定，最主要的差異是什麼？",opts:["ReadOnly 只保護 VM，CanNotDelete 保護所有資源類型","ReadOnly 允許讀取但不允許修改或刪除；CanNotDelete 允許讀取和修改但不允許刪除","CanNotDelete 比 ReadOnly 更嚴格，套用後連讀取都會被阻擋","兩者功能完全相同，只是名稱不同"],a:1,exp:"ReadOnly 允許讀取，但不允許修改或刪除，是最嚴格的鎖定。CanNotDelete 允許讀取和修改，但不允許刪除，適合防止誤刪但仍需調整設定的情境。應依業務需求選擇適當的鎖定類型。"},
  {type:"情境題",topic:"企業治理架構全局決策",scene:"Titan 科技擁有 12 個 Azure Subscriptions，稽核發現四大問題：① 部分 VM 被部署到未核准 Region；② 資源缺少 CostCenter 與 Environment Tag；③ 開發人員誤刪了一個測試 Resource Group；④ 資料治理團隊需要建立全企業資料資產清單。",q:"下列哪項架構方案最全面且正確地解決上述四個問題？",opts:["在每台 VM 上建立 Resource Lock，並要求工程師自行檢查 Region 與 Tags；以 Resource Group 名稱管理資料資產","在 Management Group/Subscription Scope 指派 Azure Policy 治理 Region 與 Tags；對不可誤刪的生產資源使用 Resource Lock；導入 Microsoft Purview 進行資料資產治理；規劃舊有 Blueprints 遷移至 Deployment Stacks","使用 Microsoft Purview 阻止 VM 建立在錯誤 Region，並使用 Azure Policy 取代所有 Resource Locks","使用 Azure RBAC 限制所有 VM 只能建立在特定 Region，並以 Tags 取代 Resource Locks"],a:1,exp:"正確架構：① ② 使用 Azure Policy（Deny/Modify/Audit）在組織層級治理 Region 與 Tags；③ 對生產資源使用 Resource Lock（CanNotDelete）防止誤刪；④ 導入 Microsoft Purview 的 Data Map / Unified Catalog 進行資料資產治理。Purview 無法限制 ARM 資源建立；RBAC 控制身分權限而非資源屬性規則；Tags 不是刪除防護機制。"},
  {type:"單選題",topic:"Microsoft Purview 定位",scene:"",q:"Titan 科技資料治理團隊需要掃描並盤點全公司在 Azure、地端與多雲環境中有哪些包含敏感客戶個資的資料資產，應使用哪項服務？",opts:["Azure Policy（建立資料掃描政策）","Resource Lock（防止資料被刪除）","Microsoft Purview（Data Map 與 Unified Catalog）","Azure Monitor（資料存取監控）"],a:2,exp:"Microsoft Purview 的 Data Map 負責掃描、分類與建立資料資產中繼資料；Unified Catalog 提供跨組織的資料探索與治理能力，適用於資料資產清單與敏感度分類。Azure Policy 管理 ARM 資源規則；Resource Lock 防止資源被刪除；Azure Monitor 監控效能與指標，三者均不具備資料資產探索功能。"},
  {type:"單選題",topic:"Azure Blueprints 退役狀態",scene:"",q:"關於 Azure Blueprints，下列何者最符合 2026 年的現況？",opts:["Azure Blueprints 是 Microsoft 目前最推薦的主要新架構治理工具","Azure Blueprints 正在 2026–2027 年分階段退役，2027 年 1 月 31 日正式退休，Microsoft 建議遷移至 Deployment Stacks + Template Specs","Azure Blueprints 與 Azure Policy 功能完全相同，可以任意替換使用","Azure Blueprints 退役後將由 Azure Monitor 接管其治理功能"],a:1,exp:"Azure Blueprints 已進入分階段退役流程：2026/7/31 起不能建立新 Blueprint 定義，2027/1/31 正式退休。Microsoft 建議將既有 Blueprints 遷移至 Azure Deployment Stacks + Template Specs。舊題庫若以 Blueprints 為現行答案需特別注意此退役狀態。"},
  {type:"單選題",topic:"Azure Policy Initiative",scene:"",q:"Azure Policy 中的 Initiative（方案）是什麼？",opts:["一種 Policy Effect，如 Audit 或 Deny 的組合設定","將多個 Policy Definitions 集合成一組治理方案，便於大規模管理多條相關規則","與 Policy Definition 完全相同，只是不同名稱的別名","只能在 Management Group 層級使用的特殊政策類型"],a:1,exp:"Initiative（方案）是將多個 Policy Definitions 封裝成一組治理方案，當企業需要同時管理多條相關規則（如「ISO 27001 合規方案」包含十幾條政策）時，可透過一個 Initiative Assignment 統一套用，簡化管理。Policy Effect 是單條政策的行為設定，與 Initiative 層級不同。"},
  {type:"單選題",topic:"Azure Tags 繼承行為",scene:"",q:"Titan 科技在 Resource Group 層級設定了 CostCenter 和 Environment Tags，請問其中的 VM、Storage Account 等子資源是否會自動繼承這些 Tags？",opts:["是，Azure Resource Manager 會自動讓所有子資源繼承父層的 Tag 值","否，Tags 不會自動繼承；若需強制所有資源具備特定 Tags，需要使用 Azure Policy","是，但只有 VM 類型的資源會繼承 Tag，其他資源類型不受影響","否，Tags 只能手動逐一套用，Azure Policy 無法自動化 Tag 管理"],a:1,exp:"Azure Resource Manager 的 Tags 不會自動從父層（Resource Group、Subscription）繼承到子資源。若企業要求每個資源都具備 CostCenter、Environment 等欄位，需使用 Azure Policy 搭配 Audit Effect 稽核缺少 Tag 的資源，或使用 Modify Effect 在符合條件的情況下自動補充 Tag。"}
];
let current=0,score=0,skipped=0,answered,shuffled;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){shuffled=shuffle(QUESTIONS.map((_,i)=>i));current=0;score=0;skipped=0;answered=new Array(QUESTIONS.length).fill(null);renderQuestion();}
function renderQuestion(){
  const total=QUESTIONS.length,q=QUESTIONS[shuffled[current]];
  document.getElementById("progressText").textContent="題目 "+(current+1)+" / "+total;
  document.getElementById("scoreText").textContent="得分："+score;
  document.getElementById("progressFill").style.width=((current/total)*100)+"%";
  document.getElementById("questionMeta").innerHTML="題目 "+(current+1)+" &bull; "+q.topic;
  document.getElementById("qtypeBadge").textContent=q.type;
  const sb=document.getElementById("scenarioBox");
  if(q.scene){sb.style.display="";document.getElementById("scenarioText").textContent=q.scene;}else{sb.style.display="none";}
  document.getElementById("questionText").textContent=q.q;
  const letters=["A","B","C","D"],container=document.getElementById("optionsContainer");
  container.innerHTML="";
  q.opts.forEach((opt,i)=>{const btn=document.createElement("button");btn.className="option-btn";btn.innerHTML="<span class=\"letter\">"+letters[i]+"</span><span>"+opt+"</span>";btn.onclick=()=>selectAnswer(i);container.appendChild(btn);});
  document.getElementById("explanation").className="explanation";document.getElementById("explanation").innerHTML="";
  document.getElementById("nextBtn").style.display="none";document.getElementById("skipBtn").style.display="";
}
function selectAnswer(idx){
  const q=QUESTIONS[shuffled[current]],buttons=document.querySelectorAll(".option-btn");
  buttons.forEach(b=>b.disabled=true);const ok=idx===q.a;if(ok)score++;answered[current]=idx;
  buttons[idx].classList.add(ok?"correct":"wrong");if(!ok)buttons[q.a].classList.add("correct");
  const exp=document.getElementById("explanation");exp.innerHTML="<strong>"+(ok?"✓ 答對了！":"✗ 答錯了")+"</strong>"+q.exp;exp.className="explanation visible";
  document.getElementById("nextBtn").style.display="";document.getElementById("skipBtn").style.display="none";
  document.getElementById("scoreText").textContent="得分："+score;
}
function skipQuestion(){skipped++;answered[current]=-1;nextQuestion();}
function nextQuestion(){current++;if(current>=QUESTIONS.length)showResults();else renderQuestion();}
function showResults(){
  const total=QUESTIONS.length,pct=Math.round((score/total)*100),pass=pct>=70;
  document.getElementById("progressFill").style.width="100%";
  document.getElementById("progressText").textContent="全部完成";
  document.getElementById("scoreText").textContent="得分："+score;
  const nextDayHtml="day27.html";
  document.getElementById("quizCard").innerHTML="<div class=\"results\"><div class=\"score-ring "+(pass?"pass":"fail")+"\"><span class=\"pct\">"+pct+"%</span><span class=\"label\">"+(pass?"通過":"未通過")+"</span></div><h2>"+(pass?"太棒了！完成！":"繼續加油！")+"</h2><p class=\"subtitle\">"+(pass?"掌握很好！":"建議複習後再試。")+"</p><div class=\"stats\"><div class=\"stat-box green\"><div class=\"num\">"+score+"</div><div class=\"desc\">答對</div></div><div class=\"stat-box red\"><div class=\"num\">"+(total-score-skipped)+"</div><div class=\"desc\">答錯</div></div><div class=\"stat-box\"><div class=\"num\">"+skipped+"</div><div class=\"desc\">略過</div></div><div class=\"stat-box\"><div class=\"num\">"+total+"</div><div class=\"desc\">總題數</div></div></div><div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap;\"><button class=\"btn btn-primary\" onclick=\"startQuiz()\">再練一次</button><a class=\"btn btn-secondary\" href=\""+nextDayHtml+"\" style=\"text-decoration:none;\">下一天 →</a></div><p class=\"disclaimer\">AZ-900 及格約 70%。題目每次隨機排序。本題庫僅供練習參考。</p></div>";
}
startQuiz();
</script>
